<svg width="1080" height="760" viewBox="0 0 1080 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <rect width="1080" height="760" fill="#fcfcfb"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#0b0b0b">存算一体 → 存算分离</text>
  <text x="60" y="92" font-size="17" fill="#52514e">Navidrome 迁移前后：数据留在 NAS，算力交给 Mac</text>

  <!-- ══════════ 左：迁移前 ══════════ -->
  <text x="60" y="150" font-size="20" font-weight="700" fill="#eb6834">迁移前 · 存算一体（NAS 扛一切）</text>
  <rect x="60" y="168" width="440" height="470" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- 手机 -->
  <rect x="150" y="196" width="120" height="52" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="210" y="218" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">📱 手机</text>
  <text x="210" y="238" font-size="12" fill="#898781" text-anchor="middle">外网听歌</text>

  <!-- 箭头 手机→NAS -->
  <path d="M 210 248 L 210 288" stroke="#898781" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="222" y="272" font-size="13" fill="#d03b3b">转码请求 · 起播慢</text>

  <!-- NAS 大盒子 -->
  <rect x="90" y="292" width="380" height="240" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="2"/>
  <text x="280" y="322" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">NAS · DS218play</text>
  <text x="280" y="344" font-size="13" fill="#52514e" text-anchor="middle">四核 A53 1.4GHz · 1GB 内存</text>

  <rect x="115" y="360" width="330" height="40" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="280" y="385" font-size="14" fill="#0b0b0b" text-anchor="middle">Navidrome：转码 + 每小时全库扫描</text>
  <rect x="115" y="408" width="330" height="40" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="280" y="433" font-size="14" fill="#0b0b0b" text-anchor="middle">Audio Station：postgres 全家桶</text>
  <rect x="115" y="456" width="330" height="40" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="280" y="481" font-size="14" fill="#0b0b0b" text-anchor="middle">85G 音乐库（机械盘）</text>

  <!-- 告警条 -->
  <rect x="90" y="512" width="380" height="34" rx="6" fill="#fbeaea"/>
  <text x="280" y="534" font-size="14" fill="#d03b3b" text-anchor="middle" font-weight="600">⚠ 内存超卖 → swap 风暴 → 整机假死（load 99）</text>

  <!-- Mac 旁观 -->
  <rect x="90" y="566" width="380" height="52" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="588" font-size="14" fill="#52514e" text-anchor="middle">Mac（常开）</text>
  <text x="280" y="606" font-size="12" fill="#898781" text-anchor="middle">只跑监控和首页 · 算力闲置</text>

  <!-- ══════════ 中间迁移箭头 ══════════ -->
  <defs>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#898781"/></marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a78d6"/></marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#eb6834"/></marker>
  </defs>
  <path d="M 516 400 L 564 400" stroke="#0b0b0b" stroke-width="3" marker-end="url(#arrGray)"/>
  <text x="540" y="384" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">迁移</text>

  <!-- ══════════ 右：迁移后 ══════════ -->
  <text x="580" y="150" font-size="20" font-weight="700" fill="#2a78d6">迁移后 · 存算分离（各司其职）</text>
  <rect x="580" y="168" width="440" height="470" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- 手机 -->
  <rect x="640" y="196" width="120" height="52" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="700" y="218" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">📱 手机</text>
  <text x="700" y="238" font-size="12" fill="#898781" text-anchor="middle">蜂窝 / 局域网</text>

  <!-- 箭头 手机→Mac -->
  <path d="M 700 248 L 700 288" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="712" y="272" font-size="13" fill="#006300">Tailscale · 任意码率秒开</text>

  <!-- Mac 大盒子 -->
  <rect x="610" y="292" width="380" height="150" rx="10" fill="#edf4fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="800" y="322" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Mac（常开 · 插电不睡）</text>
  <rect x="635" y="338" width="330" height="40" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="800" y="363" font-size="14" fill="#0b0b0b" text-anchor="middle">Navidrome：转码随便跑</text>
  <rect x="635" y="386" width="330" height="40" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="800" y="411" font-size="14" fill="#0b0b0b" text-anchor="middle">SQLite 本地卷（不放 SMB）</text>

  <!-- 箭头 Mac→NAS -->
  <path d="M 800 442 L 800 482" stroke="#eb6834" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="812" y="466" font-size="13" fill="#52514e">SMB · 按需流式读取</text>

  <!-- NAS 盒子 -->
  <rect x="610" y="486" width="380" height="132" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="2"/>
  <text x="800" y="516" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">NAS · DS218play</text>
  <rect x="635" y="530" width="330" height="36" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="800" y="553" font-size="14" fill="#0b0b0b" text-anchor="middle">85G 音乐库（机械盘）</text>
  <text x="800" y="602" font-size="13" fill="#006300" text-anchor="middle">✓ 回归纯存储 · 仅留守 node-exporter（9MB）</text>

  <text x="60" y="702" font-size="13" fill="#898781">配套自愈链：断挂 30 秒自动恢复（root 守护补目录 → 自动重挂 → 容器联动重启）；播放历史 181 条完整随库迁移。</text>
</svg>
