<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0FF"/><stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3EE8B0"/><stop offset="1" stop-color="#35D0FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
  </defs>

  <!-- 背景层 -->
  <rect width="2848" height="1600" fill="url(#bgGlow)"/>
  <rect width="2848" height="1600" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="700" cy="1150" rx="950" ry="520" fill="url(#softL)"/>

  <!-- 粒子 -->
  <circle cx="300" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="620" cy="180" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="200" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1480" cy="520" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="250" cy="700" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="1350" cy="900" r="3" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="900" cy="1050" r="2" fill="#7FA8D0" opacity="0.3"/>

  <!-- ===== 左侧图形区：文件夹 → 波形 → 手机点播 ===== -->
  <!-- 桌面线 -->
  <line x1="180" y1="1180" x2="1450" y2="1180" stroke="#3B9FE8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 文件夹：库的真身 -->
  <g filter="url(#glow)">
    <path d="M 220 400 L 400 400 L 440 448 L 660 448 L 660 760 L 220 760 Z" fill="#12294D" stroke="#35D0FF" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
  <!-- 文件夹内的音频文件 -->
  <g stroke="#3B9FE8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="270" y1="520" x2="330" y2="520"/><line x1="270" y1="548" x2="560" y2="548"/>
    <line x1="270" y1="610" x2="330" y2="610"/><line x1="270" y1="638" x2="520" y2="638"/>
    <line x1="270" y1="700" x2="330" y2="700"/><line x1="270" y1="728" x2="500" y2="728"/>
  </g>
  <text x="600" y="530" font-size="34" fill="#3EE8B0" filter="url(#glowG)">♪</text>
  <text x="640" y="660" font-size="26" fill="#3EE8B0" opacity="0.65" filter="url(#glowG)">♪</text>

  <!-- 文件夹 → 手机：音乐波形数据流 -->
  <path d="M 700 580 C 830 380 900 980 1040 820 C 1100 750 1140 760 1180 780"
        fill="none" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="846" cy="508" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="950" cy="890" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="1058" cy="820" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 手机：私人点播界面 -->
  <g filter="url(#glow)">
    <rect x="1180" y="640" width="240" height="470" rx="26" fill="#12294D" stroke="#35D0FF" stroke-width="4.5"/>
  </g>
  <line x1="1260" y1="672" x2="1340" y2="672" stroke="#3B9FE8" stroke-width="3" stroke-linecap="round"/>
  <!-- 屏内：专辑封面 + 歌名行 + 进度条 + 播放三角 -->
  <rect x="1226" y="716" width="148" height="148" rx="10" fill="#16293E" stroke="#3B9FE8" stroke-width="3"/>
  <text x="1278" y="808" font-size="52" fill="#3EE8B0" filter="url(#glowG)">♪</text>
  <line x1="1226" y1="906" x2="1374" y2="906" stroke="#3B9FE8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1226" y1="930" x2="1320" y2="930" stroke="#3B9FE8" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="1226" y1="972" x2="1374" y2="972" stroke="#132440" stroke-width="6" stroke-linecap="round"/>
  <line x1="1226" y1="972" x2="1300" y2="972" stroke="#3EE8B0" stroke-width="6" stroke-linecap="round" filter="url(#glowG)"/>
  <circle cx="1300" cy="972" r="10" fill="#3EE8B0" filter="url(#glowG)"/>
  <path d="M 1284 1020 L 1330 1046 L 1284 1072 Z" fill="#35D0FF" filter="url(#glow)"/>

  <!-- 地点标签 -->
  <g font-size="26" fill="#8FAECB" text-anchor="middle" letter-spacing="4">
    <text x="440" y="1246">FOLDER · 存储</text>
    <text x="1300" y="1246">PHONE · 点播</text>
    <text x="930" y="330" letter-spacing="4">STREAM · 私人曲库</text>
  </g>

  <!-- ===== 右侧文字区 ===== -->
  <rect x="1560" y="110" width="500" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1810" y="152" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">数字岛屿 · 私人曲库篇</text>

  <text x="1560" y="430" font-size="148" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">NAVIDROME</text>
  <text x="1560" y="566" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="4">一个文件夹变私人 Spotify</text>

  <text x="1560" y="690" font-size="40" fill="#E8F0F8">16 行配置 · <tspan fill="#3EE8B0" filter="url(#glowG)">吃灰 NAS 常开</tspan> · 全平台点播</text>

  <g font-size="30" text-anchor="middle" letter-spacing="2">
    <rect x="1560" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="1750" y="832" fill="#BBD4EE">文件夹进 · 点播出</text>
    <rect x="1964" y="790" width="360" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2144" y="832" fill="#BBD4EE">Subsonic 全平台</text>
    <rect x="2348" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2538" y="832" fill="#BBD4EE">外网零额外配置</text>
  </g>

  <text x="2768" y="1530" text-anchor="end" font-size="24" fill="#8FAECB" letter-spacing="2">屿华AI · YuHua-AIPlay</text>
</svg>
