<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.55"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.5"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="float" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 渐变底 + 光斑 -->
  <rect width="2848" height="1600" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="800" ry="600" fill="url(#glowA)"/>
  <ellipse cx="2500" cy="1300" rx="900" ry="650" fill="url(#glowB)"/>

  <!-- 装饰光点 -->
  <circle cx="400" cy="1200" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="1600" cy="200" r="4" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="2600" cy="500" r="5" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="1500" cy="1450" r="4" fill="#FFFFFF" opacity="0.35"/>

  <!-- ===== 左侧：玻璃卡片构图 ===== -->
  <!-- 文件夹玻璃卡 -->
  <g filter="url(#float)">
    <rect x="240" y="560" width="420" height="330" rx="36" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3.5"/>
  </g>
  <path d="M 300 636 L 400 636 L 428 666 L 590 666 L 590 820 L 300 820 Z" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="330" y1="710" x2="366" y2="710"/><line x1="330" y1="738" x2="540" y2="738"/>
    <line x1="330" y1="776" x2="480" y2="776"/>
  </g>
  <text x="470" y="510" text-anchor="middle" font-size="34" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="4">一个文件夹</text>

  <!-- 流光连线 -->
  <path d="M 680 760 C 800 700 830 900 960 850" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 660 700 C 760 620 860 780 950 760" fill="none" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="836" cy="762" r="10" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="920" cy="842" r="7" fill="#FFFFFF" opacity="0.6"/>

  <!-- 玻璃手机 -->
  <g filter="url(#float)">
    <rect x="980" y="440" width="360" height="700" rx="52" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="4.5"/>
  </g>
  <line x1="1120" y1="496" x2="1210" y2="496" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- 屏内播放器 -->
  <rect x="1030" y="560" width="260" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="3.5"/>
  <text x="1160" y="722" text-anchor="middle" font-size="86" fill="#FFFFFF">♪</text>
  <line x1="1030" y1="886" x2="1290" y2="886" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="1030" y1="916" x2="1200" y2="916" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="1030" y1="978" x2="1290" y2="978" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.3"/>
  <line x1="1030" y1="978" x2="1150" y2="978" stroke="#67E8F9" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1150" cy="978" r="13" fill="#67E8F9"/>
  <path d="M 1092 1024 L 1180 1072 L 1092 1120 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="1200" y="1078" font-size="34" fill="#FFFFFF" fill-opacity="0.8">私人 Spotify</text>

  <!-- ===== 右侧文字区 ===== -->
  <g>
    <rect x="1560" y="130" width="520" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <text x="1820" y="175" text-anchor="middle" font-size="30" fill="#FFFFFF" letter-spacing="6">数字岛屿 · 私人曲库篇</text>
  </g>

  <text x="1560" y="440" font-size="148" font-weight="800" fill="#FFFFFF" letter-spacing="2">NAVIDROME</text>

  <text x="1560" y="580" font-size="86" font-weight="800" fill="#FFFFFF" letter-spacing="4">一个文件夹变私人 Spotify</text>

  <text x="1560" y="698" font-size="40" fill="#E0F2FE">16 行配置 · 吃灰 NAS 常开 · 全平台点播</text>

  <g font-size="30" text-anchor="middle">
    <rect x="1560" y="790" width="370" height="66" rx="33" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    <text x="1745" y="833" fill="#FFFFFF">文件夹进 · 点播出</text>
    <rect x="1954" y="790" width="360" height="66" rx="33" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    <text x="2134" y="833" fill="#FFFFFF">Subsonic 全平台</text>
    <rect x="2338" y="790" width="380" height="66" rx="33" fill="#67E8F9" fill-opacity="0.35" stroke="#67E8F9" stroke-opacity="0.8" stroke-width="2"/>
    <text x="2528" y="833" fill="#FFFFFF">外网零额外配置</text>
  </g>

  <text x="2768" y="1530" text-anchor="end" font-size="24" fill="#E0F2FE" fill-opacity="0.75" letter-spacing="2">屿华AI · YuHua-AIPlay</text>
</svg>
