<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0FF"/><stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
  </defs>

  <!-- 背景层 -->
  <rect width="2848" height="1600" fill="url(#bgGlow)"/>
  <rect width="2848" height="1600" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="700" cy="1150" rx="950" ry="520" fill="url(#softL)"/>

  <!-- 粒子 -->
  <circle cx="300" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="620" cy="180" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="200" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1480" cy="520" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="250" cy="700" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="1350" cy="900" r="3" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="900" cy="1050" r="2" fill="#7FA8D0" opacity="0.3"/>

  <!-- ===== 左侧图形区：网页 → AI 逆向 → 二维码 → NAS ===== -->
  <!-- 桌面线 -->
  <line x1="180" y1="1180" x2="1450" y2="1180" stroke="#3B9FE8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 搜索页窗口 -->
  <g filter="url(#glow)">
    <rect x="200" y="300" width="460" height="340" rx="16" fill="#12294D" stroke="#35D0FF" stroke-width="4"/>
  </g>
  <line x1="200" y1="356" x2="660" y2="356" stroke="#3B9FE8" stroke-width="3" opacity="0.8"/>
  <circle cx="232" cy="328" r="7" fill="#3B9FE8"/>
  <circle cx="262" cy="328" r="7" fill="#3B9FE8" opacity="0.6"/>
  <circle cx="292" cy="328" r="7" fill="#3B9FE8" opacity="0.3"/>
  <!-- 搜索结果行 -->
  <g stroke="#3B9FE8" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="232" y1="410" x2="392" y2="410"/><line x1="232" y1="432" x2="500" y2="432"/>
    <line x1="232" y1="500" x2="392" y2="500"/><line x1="232" y1="522" x2="470" y2="522"/>
    <line x1="232" y1="590" x2="392" y2="590"/><line x1="232" y1="612" x2="520" y2="612"/>
  </g>
  <!-- 命中行高亮：原唱 -->
  <line x1="222" y1="472" x2="540" y2="472" stroke="#3EE8B0" stroke-width="4" filter="url(#glowG)"/>
  <text x="580" y="482" font-size="26" fill="#3EE8B0" filter="url(#glowG)">✓ 原唱</text>

  <!-- 窗口 → 放大镜：虚线 -->
  <line x1="660" y1="420" x2="820" y2="420" stroke="#3B9FE8" stroke-width="3" stroke-dasharray="10 12" opacity="0.55"/>

  <!-- AI 放大镜 -->
  <circle cx="950" cy="420" r="95" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="950" cy="420" r="48" fill="none" stroke="#3B9FE8" stroke-width="3" opacity="0.7"/>
  <circle cx="950" cy="420" r="14" fill="#3EE8B0" filter="url(#glowG)"/>
  <line x1="1018" y1="488" x2="1090" y2="560" stroke="#35D0FF" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 放大镜 → 接口卡 -->
  <line x1="1048" y1="360" x2="1118" y2="330" stroke="#35D0FF" stroke-width="3.5" opacity="0.7"/>
  <circle cx="1048" cy="360" r="8" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>

  <!-- 接口卡：JSON -->
  <rect x="1120" y="250" width="280" height="160" rx="14" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <text x="1150" y="320" font-size="27" fill="#8FAECB">{ "code": <tspan fill="#3EE8B0" filter="url(#glowG)">200</tspan>,</text>
  <text x="1150" y="365" font-size="27" fill="#8FAECB">"url": "…" }</text>

  <!-- 接口卡 → 二维码 -->
  <path d="M 1240 410 C 1240 480 1230 500 1226 548" fill="none" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1226" cy="548" r="8" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>

  <!-- 二维码：URL 的图片外衣 -->
  <rect x="1090" y="556" width="240" height="240" rx="14" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <!-- 三个定位角 -->
  <g stroke="#3B9FE8" stroke-width="4" fill="none">
    <rect x="1114" y="580" width="52" height="52"/>
    <rect x="1254" y="580" width="52" height="52"/>
    <rect x="1114" y="720" width="52" height="52"/>
  </g>
  <g fill="#3B9FE8">
    <rect x="1130" y="596" width="20" height="20"/>
    <rect x="1270" y="596" width="20" height="20"/>
    <rect x="1130" y="736" width="20" height="20"/>
  </g>
  <!-- 点阵 -->
  <g fill="#3B9FE8" opacity="0.8">
    <rect x="1194" y="580" width="18" height="18"/>
    <rect x="1240" y="606" width="18" height="18"/>
    <rect x="1194" y="650" width="18" height="18"/>
    <rect x="1230" y="690" width="18" height="18"/>
    <rect x="1194" y="730" width="18" height="18"/>
    <rect x="1272" y="736" width="18" height="18"/>
  </g>

  <!-- 二维码 → NAS：链接化为数据流 -->
  <path d="M 1090 740 C 920 880 740 900 570 940" fill="none" stroke="#35D0FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="880" cy="856" r="10" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="716" cy="898" r="10" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- NAS：两层服务器 -->
  <g stroke="#35D0FF" stroke-width="4" fill="#12294D" filter="url(#glow)">
    <rect x="290" y="960" width="280" height="84" rx="10"/>
    <rect x="290" y="1056" width="280" height="84" rx="10"/>
  </g>
  <g stroke="#3B9FE8" stroke-width="3" stroke-linecap="round">
    <line x1="316" y1="990" x2="366" y2="990"/><line x1="316" y1="1002" x2="356" y2="1002"/><line x1="316" y1="1014" x2="346" y2="1014"/>
    <line x1="316" y1="1086" x2="366" y2="1086"/><line x1="316" y1="1098" x2="356" y2="1098"/><line x1="316" y1="1110" x2="346" y2="1110"/>
  </g>
  <circle cx="538" cy="1002" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="538" cy="1098" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 地点标签 -->
  <g font-size="26" fill="#8FAECB" text-anchor="middle" letter-spacing="4">
    <text x="430" y="1246">STORE · 曲库</text>
    <text x="950" y="600">AI · 逆向</text>
    <text x="1260" y="856">QR · 外衣</text>
  </g>
  <text x="430" y="770" text-anchor="middle" font-size="26" fill="#8FAECB" letter-spacing="4">WEB · 5song.xyz</text>

  <!-- ===== 右侧文字区 ===== -->
  <rect x="1560" y="110" width="500" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1810" y="152" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">数字岛屿 · 曲库补货篇</text>

  <text x="1560" y="430" font-size="148" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">REVERSE</text>
  <text x="1560" y="566" font-size="94" font-weight="800" fill="#FFFFFF" letter-spacing="6">从扫码到一条命令</text>

  <text x="1560" y="690" font-size="40" fill="#E8F0F8">17 首歌 · <tspan fill="#3EE8B0" filter="url(#glowG)">一条命令</tspan> · 二维码只是外衣</text>

  <g font-size="30" text-anchor="middle" letter-spacing="2">
    <rect x="1560" y="790" width="360" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="1740" y="832" fill="#BBD4EE">一条命令出码</text>
    <rect x="1944" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2134" y="832" fill="#BBD4EE">歌手过滤防翻车</text>
    <rect x="2348" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2538" y="832" fill="#BBD4EE">文件直落 NAS</text>
  </g>

  <text x="2768" y="1530" text-anchor="end" font-size="24" fill="#8FAECB" letter-spacing="2">屿华AI · YuHua-AIPlay</text>
</svg>
