<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
    <filter id="glowR" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#DD4B4B"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#bgGlow)"/>
  <rect width="2400" height="1350" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="500" cy="1100" rx="900" ry="500" fill="url(#softL)"/>

  <circle cx="220" cy="240" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="700" cy="150" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="230" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1750" cy="170" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="2200" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="2150" cy="1100" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="180" cy="900" r="2" fill="#7FA8D0" opacity="0.25"/>

  <!-- 顶部胶囊 -->
  <rect x="920" y="88" width="560" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1200" y="130" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">BOTTOMLINE · 三条底线</text>

  <!-- 连线 -->
  <line x1="680" y1="660" x2="1000" y2="660" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="840" cy="660" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <line x1="1400" y1="660" x2="1720" y2="660" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1560" cy="660" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 节点 1：不喂凭据（锁 + 红斜杠） -->
  <rect x="390" y="580" width="180" height="140" rx="16" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="480" cy="580" r="62" fill="none" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="480" cy="646" r="12" fill="#3EE8B0" filter="url(#glowG)"/>
  <!-- 红色禁止斜杠 -->
  <line x1="360" y1="760" x2="600" y2="520" stroke="#DD4B4B" stroke-width="8" stroke-linecap="round" filter="url(#glowR)"/>
  <rect x="435" y="470" width="90" height="7" rx="3.5" fill="#DD4B4B" filter="url(#glowR)"/>

  <!-- 节点 2：不碰灰产（警示牌） -->
  <path d="M 1200 500 L 1350 760 H 1050 Z" fill="#12294D" stroke="#DD4B4B" stroke-width="5" stroke-linejoin="round" filter="url(#glowR)"/>
  <line x1="1200" y1="580" x2="1200" y2="670" stroke="#DD4B4B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1200" cy="706" r="8" fill="#DD4B4B"/>
  <rect x="1155" y="470" width="90" height="7" rx="3.5" fill="#DD4B4B" filter="url(#glowR)"/>

  <!-- 节点 3：验真无损（频谱：16kHz 断崖） -->
  <rect x="1770" y="520" width="320" height="240" rx="14" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <!-- 坐标轴 -->
  <line x1="1810" y1="720" x2="2050" y2="720" stroke="#3B9FE8" stroke-width="3" opacity="0.7"/>
  <line x1="1810" y1="720" x2="1810" y2="560" stroke="#3B9FE8" stroke-width="3" opacity="0.7"/>
  <!-- 频谱曲线：饱满后断崖（假无损 16kHz 截止） -->
  <path d="M 1810 716 C 1840 700 1850 590 1880 574 C 1910 560 1925 640 1945 660" fill="none" stroke="#3EE8B0" stroke-width="5" stroke-linecap="round" filter="url(#glowG)"/>
  <!-- 16kHz 分界虚线与之后的空白 -->
  <line x1="1945" y1="556" x2="1945" y2="720" stroke="#DD4B4B" stroke-width="2.5" stroke-dasharray="8 8"/>
  <path d="M 1945 712 C 1980 710 2010 716 2050 714" fill="none" stroke="#6B8299" stroke-width="4" stroke-dasharray="4 10" opacity="0.8"/>
  <text x="1945" y="540" text-anchor="middle" font-size="24" fill="#DD4B4B">16kHz</text>
  <rect x="1875" y="470" width="90" height="7" rx="3.5" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 节点标注 -->
  <g text-anchor="middle">
    <text x="480" y="960" font-size="36" font-weight="700" fill="#E8F0F8">不喂凭据</text>
    <text x="480" y="1008" font-size="28" fill="#6B8299">cookie 不进脚本</text>
    <text x="1200" y="960" font-size="36" font-weight="700" fill="#E8F0F8">不碰灰产</text>
    <text x="1200" y="1008" font-size="28" fill="#6B8299">DRM 解密工具绕行</text>
    <text x="1930" y="960" font-size="36" font-weight="700" fill="#E8F0F8">验真无损</text>
    <text x="1930" y="1008" font-size="28" fill="#6B8299">频谱照妖镜把关</text>
  </g>

  <!-- 底部金句 -->
  <text x="1200" y="1230" text-anchor="middle" font-size="46" font-weight="700" fill="#E8F0F8">链接可以自动拿，<tspan fill="#3EE8B0" filter="url(#glowG)">账号永不交给脚本</tspan></text>
</svg>
