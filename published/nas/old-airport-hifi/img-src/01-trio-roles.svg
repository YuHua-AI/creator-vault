<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#bgGlow)"/>
  <rect width="2400" height="1350" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="500" cy="1100" rx="900" ry="500" fill="url(#softL)"/>

  <circle cx="220" cy="240" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="700" cy="150" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="230" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1750" cy="170" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="2200" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="2150" cy="1100" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="180" cy="900" r="2" fill="#7FA8D0" opacity="0.25"/>

  <!-- 顶部胶囊 -->
  <rect x="940" y="88" width="520" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1200" y="130" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">ROLES · 铁三角分工</text>

  <!-- 三角连线：顶弧（无线流） -->
  <path d="M 440 612 C 700 320 1650 320 1915 424" fill="none" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="900" cy="428" r="11" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="1450" cy="404" r="11" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="440" cy="612" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>
  <circle cx="1915" cy="424" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>

  <!-- 连线：NAS → 老路由 -->
  <line x1="600" y1="708" x2="1080" y2="708" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="600" cy="708" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>
  <circle cx="1080" cy="708" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>
  <circle cx="840" cy="708" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 连线：老路由 → 音箱 -->
  <path d="M 1330 708 C 1480 708 1620 690 1800 690" fill="none" stroke="#35D0FF" stroke-width="3.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1330" cy="708" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>
  <circle cx="1800" cy="690" r="9" fill="#0A1826" stroke="#E8F0F8" stroke-width="3"/>
  <circle cx="1560" cy="700" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- NAS：两层服务器 -->
  <g stroke="#35D0FF" stroke-width="4" fill="#12294D" filter="url(#glow)">
    <rect x="280" y="620" width="320" height="80" rx="10"/>
    <rect x="280" y="716" width="320" height="80" rx="10"/>
  </g>
  <g stroke="#3B9FE8" stroke-width="3" stroke-linecap="round">
    <line x1="306" y1="648" x2="356" y2="648"/><line x1="306" y1="660" x2="346" y2="660"/><line x1="306" y1="672" x2="336" y2="672"/>
    <line x1="306" y1="744" x2="356" y2="744"/><line x1="306" y1="756" x2="346" y2="756"/><line x1="306" y1="768" x2="336" y2="768"/>
  </g>
  <circle cx="564" cy="660" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="564" cy="756" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 老路由小方盒 -->
  <rect x="1080" y="590" width="250" height="250" rx="30" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1110" cy="620" r="7" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="1300" cy="782" r="28" fill="#0A1826" stroke="#3B9FE8" stroke-width="4"/>

  <!-- 有源音箱 -->
  <rect x="1800" y="430" width="230" height="460" rx="26" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1915" cy="556" r="46" fill="none" stroke="#3B9FE8" stroke-width="4"/>
  <circle cx="1915" cy="724" r="84" fill="none" stroke="#3B9FE8" stroke-width="4"/>
  <circle cx="1915" cy="724" r="38" fill="none" stroke="#3B9FE8" stroke-width="3" opacity="0.7"/>
  <circle cx="1996" cy="852" r="7" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 节点标注 -->
  <g text-anchor="middle">
    <text x="440" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">NAS · 曲库</text>
    <text x="440" y="1048" font-size="28" fill="#6B8299">Navidrome 无损曲库</text>
    <text x="1205" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">老路由 · 解码</text>
    <text x="1205" y="1048" font-size="28" fill="#6B8299">AirPlay 接收端</text>
    <text x="1915" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">音箱 · 发声</text>
    <text x="1915" y="1048" font-size="28" fill="#6B8299">有源发声终端</text>
  </g>

  <!-- 底部金句 -->
  <text x="1200" y="1230" text-anchor="middle" font-size="46" font-weight="700" fill="#E8F0F8">NAS 管存，<tspan fill="#3EE8B0" filter="url(#glowG)">音箱管唱</tspan></text>
</svg>
