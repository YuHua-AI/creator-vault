<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
    <filter id="glowR" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#DD4B4B"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#bgGlow)"/>
  <rect width="2400" height="1350" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="500" cy="1100" rx="900" ry="500" fill="url(#softL)"/>

  <circle cx="220" cy="240" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="700" cy="150" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="230" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1750" cy="170" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="2200" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="2150" cy="1100" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="180" cy="900" r="2" fill="#7FA8D0" opacity="0.25"/>

  <!-- 顶部胶囊 -->
  <rect x="940" y="88" width="520" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1200" y="130" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">SETUP · 配置三坑</text>

  <!-- ===== 坑一：恢复出厂（回形针 + reset 孔） ===== -->
  <rect x="310" y="520" width="250" height="250" rx="26" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="336" cy="546" r="6" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="522" cy="722" r="13" fill="#0A1826" stroke="#3B9FE8" stroke-width="3.5"/>
  <circle cx="690" cy="560" r="15" fill="none" stroke="#E8F0F8" stroke-width="4"/>
  <path d="M 690 575 C 660 620 590 680 530 714" fill="none" stroke="#E8F0F8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ===== 坑二：别选错项（手机 + 两个选项） ===== -->
  <rect x="1090" y="460" width="220" height="420" rx="26" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <text x="1200" y="516" text-anchor="middle" font-size="22" fill="#8FAECB">设置</text>
  <rect x="1108" y="540" width="190" height="64" rx="10" fill="none" stroke="#3EE8B0" stroke-width="3"/>
  <circle cx="1136" cy="572" r="11" fill="none" stroke="#3EE8B0" stroke-width="3"/>
  <path d="M 1131 572 l 4 5 l 9 -11" fill="none" stroke="#3EE8B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1156" y="581" font-size="22" fill="#3EE8B0">加入现有网络</text>
  <rect x="1108" y="628" width="190" height="64" rx="10" fill="none" stroke="#DD4B4B" stroke-width="3"/>
  <path d="M 1129 653 L 1143 667 M 1143 653 L 1129 667" stroke="#DD4B4B" stroke-width="3" stroke-linecap="round"/>
  <text x="1156" y="669" font-size="22" fill="#DD4B4B">创建网络</text>
  <line x1="1154" y1="654" x2="1246" y2="654" stroke="#DD4B4B" stroke-width="2" opacity="0.7"/>

  <!-- ===== 坑三：能插就插（网线 + 小方盒） ===== -->
  <rect x="1840" y="560" width="220" height="220" rx="26" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1866" cy="586" r="6" fill="#3EE8B0" filter="url(#glowG)"/>
  <rect x="1830" y="644" width="20" height="52" rx="4" fill="#0A1826" stroke="#3B9FE8" stroke-width="3"/>
  <rect x="1778" y="648" width="52" height="44" rx="6" fill="#12294D" stroke="#35D0FF" stroke-width="3.5"/>
  <path d="M 1778 670 C 1700 690 1660 720 1630 760" fill="none" stroke="#E8F0F8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- 坑标记 + 标注 -->
  <g fill="#DD4B4B" filter="url(#glowR)">
    <rect x="395" y="924" width="90" height="7" rx="3.5"/>
    <rect x="1155" y="924" width="90" height="7" rx="3.5"/>
    <rect x="1915" y="924" width="90" height="7" rx="3.5"/>
  </g>
  <g text-anchor="middle">
    <text x="440" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">恢复出厂</text>
    <text x="440" y="1048" font-size="28" fill="#6B8299">回形针顶住小孔十秒</text>
    <text x="1200" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">别选错项</text>
    <text x="1200" y="1048" font-size="28" fill="#6B8299">选「加入现有网络」</text>
    <text x="1960" y="1000" font-size="36" font-weight="700" fill="#E8F0F8">能插就插</text>
    <text x="1960" y="1048" font-size="28" fill="#6B8299">网线比 Wi-Fi 稳</text>
  </g>

  <!-- 底部金句 -->
  <text x="1200" y="1230" text-anchor="middle" font-size="46" font-weight="700" fill="#E8F0F8">照着三步走，<tspan fill="#3EE8B0" filter="url(#glowG)">坑全绕开</tspan></text>
</svg>
