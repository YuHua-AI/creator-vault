<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#C9D8E8"/>
    </pattern>
  </defs>

  <!-- 米白纸底 + 点阵 -->
  <rect width="2848" height="1600" fill="#FAF7F2"/>
  <rect width="2848" height="1600" fill="url(#dots)" opacity="0.5"/>

  <!-- ===== 左侧：手绘文件夹 → 手机 ===== -->
  <!-- 手绘文件夹：双线描边模拟手绘 -->
  <g fill="none" stroke="#22405E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 240 430 L 430 424 L 468 470 L 672 464 L 682 764 L 248 772 Z"/>
    <path d="M 262 452 L 424 447 L 460 490 L 654 485" stroke-width="4" opacity="0.55"/>
  </g>
  <!-- 文件行 -->
  <g stroke="#22405E" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
    <line x1="300" y1="560" x2="356" y2="558"/><line x1="300" y1="590" x2="590" y2="584"/>
    <line x1="300" y1="650" x2="356" y2="648"/><line x1="300" y1="680" x2="548" y2="676"/>
    <line x1="300" y1="716" x2="356" y2="714"/>
  </g>
  <!-- 手绘音符 -->
  <g stroke="#FF6B35" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="740" cy="440" r="26" fill="#FF6B35"/>
    <line x1="764" y1="436" x2="770" y2="330"/>
    <path d="M 770 330 C 800 336 812 356 806 380"/>
  </g>
  <!-- 手绘波浪连线 -->
  <path d="M 700 640 C 780 560 830 760 910 680 C 950 636 990 660 1030 700"
        fill="none" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/>
  <!-- 箭头 -->
  <path d="M 1030 700 L 990 692 M 1030 700 L 1008 668" fill="none" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/>
  <!-- 手绘手机 -->
  <g fill="none" stroke="#22405E" stroke-width="6" stroke-linejoin="round">
    <rect x="1100" y="580" width="260" height="500" rx="34"/>
  </g>
  <rect x="1150" y="640" width="160" height="160" rx="14" fill="none" stroke="#FF6B35" stroke-width="5"/>
  <text x="1218" y="742" text-anchor="middle" font-size="64" fill="#FF6B35">♪</text>
  <line x1="1150" y1="856" x2="1310" y2="854" stroke="#22405E" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="1150" y1="888" x2="1260" y2="886" stroke="#22405E" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="1150" y1="952" x2="1310" y2="950" stroke="#C9D8E8" stroke-width="8" stroke-linecap="round"/>
  <line x1="1150" y1="952" x2="1230" y2="951" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
  <path d="M 1200 996 L 1272 1032 L 1200 1068 Z" fill="#22405E"/>
  <!-- 手绘星标点缀 -->
  <g stroke="#FF6B35" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 880 420 L 892 448 L 922 452 L 900 472 L 906 502 L 880 488 L 854 502 L 860 472 L 838 452 L 868 448 Z"/>
  </g>
  <g stroke="#22405E" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M 200 900 L 228 928 M 228 900 L 200 928"/>
    <path d="M 1450 380 L 1472 402 M 1472 380 L 1450 402"/>
  </g>
  <!-- 地面短横 -->
  <g stroke="#22405E" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <line x1="300" y1="860" x2="420" y2="856"/>
    <line x1="360" y1="900" x2="520" y2="896"/>
    <line x1="1150" y1="1160" x2="1330" y2="1156"/>
  </g>

  <!-- ===== 右侧文字区 ===== -->
  <rect x="1580" y="120" width="520" height="70" rx="35" fill="none" stroke="#22405E" stroke-width="4"/>
  <text x="1840" y="167" text-anchor="middle" font-size="31" fill="#22405E" letter-spacing="6">数字岛屿 · 私人曲库篇</text>

  <text x="1580" y="420" font-size="140" font-weight="800" fill="#22405E" letter-spacing="2">NAVIDROME</text>
  <!-- 手绘下划线 -->
  <path d="M 1584 456 C 1760 442 2200 448 2540 452" fill="none" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
  <text x="1580" y="580" font-size="84" font-weight="700" fill="#22405E" letter-spacing="4">一个文件夹</text>
  <text x="1580" y="696" font-size="84" font-weight="700" fill="#FF6B35" letter-spacing="4">变私人 Spotify</text>

  <text x="1580" y="800" font-size="38" fill="#5A7188">16 行配置 · 吃灰 NAS 常开 · 全平台点播</text>

  <!-- 手绘圈注 -->
  <g fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round">
    <ellipse cx="2086" cy="792" rx="220" ry="40" transform="rotate(-3 2086 792)"/>
  </g>

  <g font-size="29" text-anchor="middle">
    <rect x="1580" y="880" width="360" height="64" rx="32" fill="#22405E"/>
    <text x="1760" y="921" fill="#FAF7F2">文件夹进 · 点播出</text>
    <rect x="1964" y="880" width="360" height="64" rx="32" fill="#FF6B35"/>
    <text x="2144" y="921" fill="#FFFFFF">Subsonic 全平台</text>
    <rect x="2348" y="880" width="380" height="64" rx="32" fill="none" stroke="#22405E" stroke-width="3.5"/>
    <text x="2538" y="921" fill="#22405E">外网零额外配置</text>
  </g>

  <text x="2768" y="1520" text-anchor="end" font-size="24" fill="#8CA3B8" letter-spacing="2">屿华AI · YuHua-AIPlay</text>
</svg>
