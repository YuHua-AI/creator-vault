<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 分节图：四层架构 -->
  <defs>
    <pattern id="g1" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="#0E2A47"/>
  <rect width="2400" height="1350" fill="url(#g1)"/>
  <rect x="40" y="40" width="2320" height="1270" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="60" y="60" width="2280" height="1230" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="120" y="150" fill="#9FC3E8" font-size="32" letter-spacing="8">ARCHITECTURE · 四层架构</text>
  <line x1="120" y1="175" x2="720" y2="175" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
  <text x="120" y="240" fill="#F4F9FE" font-size="54" font-weight="800">每一层只做一件事，换卡只改一行配置</text>

  <!-- 四层堆叠（自上而下） -->
  <g text-anchor="middle">
    <g transform="translate(1170,420)">
      <rect x="-750" y="-85" width="1500" height="170" rx="10" fill="#123A63" stroke="#F4F9FE" stroke-width="3.5"/>
      <text y="-24" fill="#F4F9FE" font-size="42" font-weight="800">④ 流程引擎</text>
      <text y="45" fill="#9FC3E8" font-size="30">steps 判定 · while 轮询 · 变量断言 · abort / continue</text>
    </g>
    <g transform="translate(1170,650)">
      <rect x="-750" y="-85" width="1500" height="170" rx="10" fill="#0B2440" stroke="#F4F9FE" stroke-width="3.5"/>
      <text y="-24" fill="#F4F9FE" font-size="42" font-weight="800">③ UDS 会话层</text>
      <text y="45" fill="#9FC3E8" font-size="30">请求/响应 · NRC 解析 · 0x78 循环等待 · P2 / P2* 定时器</text>
    </g>
    <g transform="translate(1170,880)">
      <rect x="-750" y="-85" width="1500" height="170" rx="10" fill="#0B2440" stroke="#F4F9FE" stroke-width="3.5"/>
      <text y="-24" fill="#F4F9FE" font-size="42" font-weight="800">② ISO-TP 传输层 · ISO 15765-2</text>
      <text y="45" fill="#9FC3E8" font-size="30">SF / FF / CF / FC · 流控 BS 与 STmin · N_Bs / N_Cr 超时</text>
    </g>
    <g transform="translate(1170,1110)">
      <rect x="-750" y="-85" width="1500" height="170" rx="10" fill="#123A63" stroke="#F4F9FE" stroke-width="3.5"/>
      <text y="-24" fill="#F4F9FE" font-size="42" font-weight="800">① CAN 驱动抽象</text>
      <text y="45" fill="#9FC3E8" font-size="30">send / recv 帧级接口 · 周立功 / 创芯 / Mock 三实现</text>
    </g>
  </g>

  <!-- 左：报文流向 -->
  <g stroke="#E8A44C" stroke-width="3" fill="none">
    <path d="M240,350 L240,1150"/><path d="M240,1150 L224,1120 M240,1150 L256,1120"/>
    <path d="M300,1150 L300,350"/><path d="M300,350 L284,380 M300,350 L316,380"/>
  </g>
  <text x="180" y="760" fill="#E8A44C" font-size="26" writing-mode="tb">请求下行</text>
  <text x="330" y="760" fill="#E8A44C" font-size="26" writing-mode="tb">响应上行</text>

  <!-- 右：YAML 注入 -->
  <g transform="translate(2060,760)">
    <rect x="-160" y="-280" width="320" height="560" rx="12" fill="#0B2440" stroke="#7FB2E8" stroke-width="2.5"/>
    <text x="0" y="-215" fill="#F4F9FE" font-size="32" font-weight="800" text-anchor="middle">YAML 注入</text>
    <line x1="-120" y1="-185" x2="120" y2="-185" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g font-size="27" fill="#9FC3E8" text-anchor="start">
      <text x="-125" y="-125">项目配置</text>
      <text x="-125" y="-80" font-size="25" fill="#7FB2E8">can / diagnostic</text>
      <text x="-125" y="-38" font-size="25" fill="#7FB2E8">timing / security</text>
      <text x="-125" y="45">测试用例</text>
      <text x="-125" y="90" font-size="25" fill="#7FB2E8">steps / on_fail</text>
      <text x="-125" y="132" font-size="25" fill="#7FB2E8">timing 覆盖</text>
    </g>
    <text x="0" y="225" fill="#6E96C2" font-size="25" text-anchor="middle">换项目 = 换配置</text>
  </g>
  <g stroke="#E8A44C" stroke-width="2.5" fill="none">
    <path d="M1890,760 L2000,760 L2000,760"/>
    <path d="M1890,760 L1918,742 M1890,760 L1918,778"/>
  </g>

  <!-- 图纸角标 -->
  <g font-size="22" fill="#9FC3E8">
    <rect x="1810" y="1190" width="500" height="80" fill="none" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="1810" y1="1230" x2="2310" y2="1230" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="2080" y1="1190" x2="2080" y2="1270" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1830" y="1218">FIG. TOOL-1</text>
    <text x="1830" y="1258">STACK 4 LAYERS</text>
    <text x="2100" y="1218">REV. 2026</text>
    <text x="2100" y="1258">SHEET 01</text>
  </g>
</svg>
