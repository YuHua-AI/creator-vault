<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 封面：用 Claude Code 开发诊断测试工具 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 实战 · 诊断工具 ⑤ · 收官</text>
  <text x="160" y="340" fill="#F4F9FE" font-size="88" font-weight="800">用 Claude Code 开发诊断测试工具</text>
  <text x="160" y="440" fill="#9FC3E8" font-size="52">superpowers 工作流 · TDD 全程 Mock · 人机分工</text>
  <line x1="160" y1="480" x2="2560" y2="480" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 左：工作流五段（左对齐卡，x=200..940） -->
  <g transform="translate(200,580)" text-anchor="middle">
    <g transform="translate(370,90)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#123A63" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">① brainstorm</text>
      <text y="48" fill="#9FC3E8" font-size="27">收敛需求 · 明确目标</text>
    </g>
    <g transform="translate(370,265)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">② 设计文档 design</text>
      <text y="48" fill="#9FC3E8" font-size="27">架构 · 选型 · 留档</text>
    </g>
    <g transform="translate(370,440)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">③ 实施计划 plan</text>
      <text y="48" fill="#9FC3E8" font-size="27">带勾选框的任务序列</text>
    </g>
    <g transform="translate(370,615)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">④ TDD 实现</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">写测试 → 跑红 → 实现 → 跑绿</text>
    </g>
    <g transform="translate(370,790)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#123A63" stroke="#E8A44C" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">证据链可查</text>
      <text y="48" fill="#9FC3E8" font-size="27">四组 design / plan 成对文档留档</text>
    </g>
  </g>
  <g stroke="#E8A44C" stroke-width="3" fill="none">
    <path d="M570,745 L570,768 M570,768 L554,742 M570,768 L586,742"/>
    <path d="M570,920 L570,943 M570,943 L554,917 M570,943 L586,917"/>
    <path d="M570,1095 L570,1118 M570,1118 L554,1092 M570,1118 L586,1092"/>
    <path d="M570,1270 L570,1293 M570,1293 L554,1267 M570,1293 L586,1267"/>
  </g>

  <!-- 中：AI 友好设计（整卡，x=1128..1868） -->
  <g transform="translate(1498,580)">
    <rect x="-370" y="0" width="740" height="820" rx="14" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
    <text x="-330" y="70" fill="#9FC3E8" font-size="30" font-weight="700">工具的 AI 友好设计</text>
    <line x1="-330" y1="95" x2="330" y2="95" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g fill="#F4F9FE" font-size="28">
      <text x="-330" y="160" font-weight="700">协议标准化</text>
      <text x="-330" y="205" fill="#9FC3E8" font-size="25">ISO 14229 / 15765-2 公开规范</text>
      <text x="-330" y="285" font-weight="700">测试免硬件</text>
      <text x="-330" y="330" fill="#9FC3E8" font-size="25">Mock 驱动 · 18 个测试文件几秒跑完</text>
      <text x="-330" y="410" font-weight="700">结果可断言</text>
      <text x="-330" y="455" fill="#9FC3E8" font-size="25">log / csv / 退出码全部机器可验证</text>
      <text x="-330" y="535" font-weight="700">需求文本化</text>
      <text x="-330" y="580" fill="#9FC3E8" font-size="25">YAML 用例 AI 能生成也能执行</text>
      <text x="-330" y="660" font-weight="700">CI 能执行 → Agent 能执行</text>
      <text x="-330" y="705" fill="#E8A44C" font-size="25">① 篇伏笔在此收束</text>
    </g>
    <text x="-330" y="785" fill="#6E96C2" font-size="25">可断言的输出 ≈ 可观测性</text>
  </g>

  <!-- 右：人的三类判断（居中卡，x=2056..2676） -->
  <g transform="translate(2366,580)" text-anchor="middle">
    <g transform="translate(0,120)">
      <rect x="-310" y="-90" width="620" height="180" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-30" fill="#F4F9FE" font-size="36" font-weight="700">协议事实的裁决</text>
      <text y="20" fill="#9FC3E8" font-size="25">AI 记忆可能有偏差</text>
      <text y="60" fill="#9FC3E8" font-size="25">以 ISO 14229 为准，人核对</text>
    </g>
    <g transform="translate(0,350)">
      <rect x="-310" y="-90" width="620" height="180" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-30" fill="#F4F9FE" font-size="36" font-weight="700">工程取舍的拍板</text>
      <text y="20" fill="#9FC3E8" font-size="25">可复现性 &gt; 便利性</text>
      <text y="60" fill="#9FC3E8" font-size="25">取舍基于踩坑经验</text>
    </g>
    <g transform="translate(0,580)">
      <rect x="-310" y="-90" width="620" height="180" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-30" fill="#F4F9FE" font-size="36" font-weight="700">安全边界的划定</text>
      <text y="20" fill="#9FC3E8" font-size="25">密钥只走本地配置</text>
      <text y="60" fill="#9FC3E8" font-size="25">演示全走 Mock 数据</text>
    </g>
    <g transform="translate(0,790)">
      <rect x="-310" y="-70" width="620" height="140" rx="12" fill="#123A63" stroke="#E8A44C" stroke-width="3"/>
      <text y="-8" fill="#E8A44C" font-size="32" font-weight="700">AI 体力活 · 人定标准</text>
      <text y="45" fill="#9FC3E8" font-size="25">人从执行者变成审核者</text>
    </g>
  </g>
  <g stroke="#E8A44C" stroke-width="2.5" fill="none">
    <path d="M2366,795 L2366,833 M2366,833 L2350,807 M2366,833 L2382,807"/>
    <path d="M2366,1025 L2366,1063 M2366,1063 L2350,1037 M2366,1063 L2382,1037"/>
    <path d="M2366,1255 L2366,1293 M2366,1293 L2350,1267 M2366,1293 L2382,1267"/>
  </g>

  <!-- 底部注脚 -->
  <text x="160" y="1500" fill="#6E96C2" font-size="28">Claude Code · superpowers · pytest on Mock</text>
  <text x="2688" y="1500" fill="#6E96C2" font-size="28" text-anchor="end">系列五篇 · 收官</text>
</svg>
