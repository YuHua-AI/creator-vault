<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 封面：DTC/Event/FiM 故障报告自动化 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 实战 · 诊断工具 ④</text>
  <text x="160" y="340" fill="#F4F9FE" font-size="88" font-weight="800">DTC / Event / FiM 故障报告自动化</text>
  <text x="160" y="440" fill="#9FC3E8" font-size="52">DEM 数据采集 · 三张映射表 · 离线解析抓包</text>
  <line x1="160" y1="480" x2="2560" y2="480" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 左：映射表卡 -->
  <g transform="translate(160,580)">
    <rect x="0" y="0" width="740" height="820" rx="14" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
    <text x="40" y="70" fill="#9FC3E8" font-family="'Consolas','Menlo',monospace" font-size="30">dtc_map.yaml</text>
    <line x1="40" y1="95" x2="700" y2="95" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g font-family="'Consolas','Menlo',monospace" font-size="29" fill="#F4F9FE">
      <text x="40" y="160"><tspan fill="#7FB2E8">0x1A2B3C</tspan>: <tspan fill="#E8A44C">车速信号无效</tspan></text>
      <text x="40" y="225"><tspan fill="#7FB2E8">0x0C1234</tspan>: <tspan fill="#E8A44C">传感器电路故障</tspan></text>
    </g>
    <line x1="40" y1="270" x2="700" y2="270" stroke="#DCE9F5" stroke-opacity="0.2" stroke-width="1"/>
    <text x="40" y="330" fill="#9FC3E8" font-family="'Consolas','Menlo',monospace" font-size="30">event_map.yaml</text>
    <g font-family="'Consolas','Menlo',monospace" font-size="29" fill="#F4F9FE">
      <text x="40" y="395"><tspan fill="#7FB2E8">1</tspan>: <tspan fill="#E8A44C">车速信号无效事件</tspan></text>
      <text x="40" y="460"><tspan fill="#7FB2E8">2</tspan>: <tspan fill="#E8A44C">电压过高事件</tspan></text>
    </g>
    <line x1="40" y1="505" x2="700" y2="505" stroke="#DCE9F5" stroke-opacity="0.2" stroke-width="1"/>
    <text x="40" y="565" fill="#9FC3E8" font-family="'Consolas','Menlo',monospace" font-size="30">fimfid_map.yaml</text>
    <g font-family="'Consolas','Menlo',monospace" font-size="29" fill="#F4F9FE">
      <text x="40" y="630"><tspan fill="#7FB2E8">1</tspan>: <tspan fill="#E8A44C">车速显示功能</tspan></text>
      <text x="40" y="695"><tspan fill="#7FB2E8">3</tspan>: <tspan fill="#E8A44C">巡航功能</tspan></text>
    </g>
    <text x="40" y="780" fill="#6E96C2" font-size="26">重复键直接报错，不静默覆盖</text>
  </g>

  <!-- 中：五项采集 -->
  <g transform="translate(1484,580)" text-anchor="middle">
    <g transform="translate(0,90)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">① 进扩展会话</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">10 03 · 失败不阻断</text>
    </g>
    <g transform="translate(0,265)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">② 安全解锁（可选）</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">0x27 · 配置提供等级</text>
    </g>
    <g transform="translate(0,440)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#123A63" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">③ 读 DTC</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">19 02 0F · 八位状态拆解</text>
    </g>
    <g transform="translate(0,615)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">④ 读 event 状态</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">22 读当前 / 本周期 / 历史</text>
    </g>
    <g transform="translate(0,790)">
      <rect x="-370" y="-70" width="740" height="140" rx="12" fill="#0B2440" stroke="#E8A44C" stroke-width="3"/>
      <text y="-8" fill="#F4F9FE" font-size="36" font-weight="700">⑤ 读 FiM 抑制</text>
      <text y="48" fill="#9FC3E8" font-size="27" font-family="'Consolas','Menlo',monospace">22 读 FID 位图</text>
    </g>
  </g>
  <g stroke="#E8A44C" stroke-width="3" fill="none">
    <path d="M1484,748 L1484,768 M1484,768 L1468,742 M1484,768 L1500,742"/>
    <path d="M1484,923 L1484,943 M1484,943 L1468,917 M1484,943 L1500,917"/>
    <path d="M1484,1098 L1484,1118 M1484,1118 L1468,1092 M1484,1118 L1500,1092"/>
    <path d="M1484,1273 L1484,1293 M1484,1293 L1468,1267 M1484,1293 L1500,1267"/>
  </g>

  <!-- 右：报告输出卡 -->
  <g transform="translate(2378,580)">
    <rect x="-310" y="0" width="620" height="820" rx="14" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
    <text x="-270" y="70" fill="#9FC3E8" font-size="30" font-weight="700">报告输出</text>
    <line x1="-270" y1="95" x2="270" y2="95" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g font-family="'Consolas','Menlo',monospace" font-size="27" fill="#F4F9FE">
      <text x="-270" y="160">1A2B3C  <tspan fill="#E8A44C">车速信号无效</tspan></text>
      <text x="-270" y="210">  0x2F  <tspan fill="#9FC3E8">testFailed|</tspan></text>
      <text x="-270" y="260" fill="#9FC3E8">  confirmedDTC|<tspan fill="#9FC3E8">WIR</tspan></text>
      <text x="-270" y="330">0C1234  <tspan fill="#E8A44C">传感器电路故障</tspan></text>
      <text x="-270" y="380">  0x08  <tspan fill="#9FC3E8">confirmedDTC</tspan></text>
      <text x="-270" y="450" fill="#6E96C2">event 置位：</text>
      <text x="-270" y="500">  1: <tspan fill="#E8A44C">车速信号无效事件</tspan></text>
      <text x="-270" y="570" fill="#6E96C2">fimfid 置位：</text>
      <text x="-270" y="620">  1: <tspan fill="#E8A44C">车速显示功能</tspan></text>
    </g>
    <line x1="-270" y1="680" x2="270" y2="680" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="-270" y="740" fill="#6E96C2" font-size="25">原始值与位拆解并排给出</text>
    <text x="-270" y="785" fill="#6E96C2" font-size="25">查不到就露编号，不编名字</text>
  </g>

  <!-- 右上小标：dem-map -->
  <g transform="translate(2378,500)">
    <rect x="-310" y="-60" width="620" height="120" rx="12" fill="#123A63" stroke="#E8A44C" stroke-width="2.5"/>
    <text y="12" fill="#F4F9FE" font-size="30" font-weight="700" text-anchor="middle">dem-map · 离线解析抓包</text>
  </g>

  <!-- 底部注脚 -->
  <text x="160" y="1500" fill="#6E96C2" font-size="28">ISO 14229 · 19 02 / 22 DID / DTC status 8 bits</text>
  <text x="2688" y="1500" fill="#6E96C2" font-size="28" text-anchor="end">解析是纯函数 · 在线离线同一段代码</text>
</svg>
