<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <!-- 风格 A：DID 门牌系统 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 入门 · ④</text>
  <text x="160" y="330" fill="#F4F9FE" font-size="96" font-weight="800">DID，ECU 数据的门牌号</text>
  <text x="160" y="430" fill="#9FC3E8" font-size="52">0x22 读数据 · 0x2E 写数据</text>
  <line x1="160" y1="470" x2="1750" y2="470" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- ECU 楼 -->
  <g transform="translate(1424,1050)">
    <rect x="-380" y="-280" width="760" height="560" fill="#0B2440" stroke="#F4F9FE" stroke-width="4"/>
    <rect x="-380" y="-280" width="760" height="100" fill="#123A63"/>
    <text y="-210" fill="#F4F9FE" font-size="52" font-weight="800" text-anchor="middle">ECU 数据大楼</text>
    <!-- 门牌行 -->
    <g font-family="'SF Mono','Menlo',monospace" font-size="34" text-anchor="middle">
      <rect x="-320" y="-130" width="640" height="90" fill="#123A63" stroke="#E8A44C" stroke-width="2.5"/>
      <text y="-70" fill="#E8A44C">F190  →  VIN 车架号</text>
      <rect x="-320" y="-20" width="640" height="90" fill="#123A63" stroke="#DCE9F5" stroke-width="2"/>
      <text y="40" fill="#F4F9FE">F187 / F188 / F189  备件·软件·版本</text>
      <rect x="-320" y="90" width="640" height="90" fill="#123A63" stroke="#DCE9F5" stroke-width="2"/>
      <text y="150" fill="#F4F9FE">F186 当前会话 · F191 boot 标识</text>
      <rect x="-320" y="200" width="640" height="90" fill="#0B2440" stroke="#7FB2E8" stroke-width="2" stroke-dasharray="12 8"/>
      <text y="260" fill="#7FB2E8">0x0100~0xDFFF  车厂自定义</text>
    </g>
  </g>
  <text x="1424" y="1420" fill="#7FB2E8" font-size="30" text-anchor="middle">F18x / F19x = 标准保留区（Annex C.1）· 全行业同一块门牌</text>

  <!-- 读/写两只手 -->
  <g font-size="40" font-family="'SF Mono','Menlo',monospace">
    <g transform="translate(500,900)">
      <rect x="-220" y="-70" width="440" height="140" rx="16" fill="#123A63" stroke="#7FB2E8" stroke-width="3"/>
      <text y="0" fill="#7FB2E8" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="30">读 · 可一次多个</text>
      <text y="50" fill="#F4F9FE" text-anchor="middle">→ 22 F1 90</text>
    </g>
    <g transform="translate(2348,900)">
      <rect x="-220" y="-70" width="440" height="140" rx="16" fill="#123A63" stroke="#E8A44C" stroke-width="3"/>
      <text y="0" fill="#E8A44C" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="30">写 · 需先解锁</text>
      <text y="50" fill="#F4F9FE" text-anchor="middle">→ 2E F1 90 <VIN 20B></text>
    </g>
  </g>
  <line x1="720" y1="920" x2="1030" y2="990" stroke="#7FB2E8" stroke-width="2.5"/>
  <line x1="2128" y1="920" x2="1818" y2="990" stroke="#E8A44C" stroke-width="2.5"/>

  <text x="160" y="1500" fill="#6E96C2" font-size="28">ISO 14229-1:2020 §11 · Annex C.1</text>
</svg>
