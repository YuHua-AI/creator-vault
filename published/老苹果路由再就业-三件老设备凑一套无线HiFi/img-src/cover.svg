<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.72" cy="0.22" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <radialGradient id="softL">
      <stop offset="0" stop-color="#14405E" stop-opacity="0.45"/><stop offset="1" stop-color="#14405E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0FF"/><stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
  </defs>

  <!-- 背景层 -->
  <rect width="2848" height="1600" fill="url(#bgGlow)"/>
  <rect width="2848" height="1600" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="700" cy="1150" rx="950" ry="520" fill="url(#softL)"/>

  <!-- 粒子 -->
  <circle cx="300" cy="300" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="620" cy="180" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1200" cy="260" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="1480" cy="520" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="250" cy="700" r="2" fill="#7FA8D0" opacity="0.25"/>
  <circle cx="1350" cy="420" r="3" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="900" cy="900" r="2" fill="#7FA8D0" opacity="0.3"/>

  <!-- ===== 左侧图形区：书架上的铁三角 ===== -->
  <!-- 书架 -->
  <line x1="180" y1="1180" x2="1450" y2="1180" stroke="#3B9FE8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- NAS：两层服务器 -->
  <g stroke="#35D0FF" stroke-width="4" fill="#12294D" filter="url(#glow)">
    <rect x="260" y="1000" width="280" height="84" rx="10"/>
    <rect x="260" y="1096" width="280" height="84" rx="10"/>
  </g>
  <g stroke="#3B9FE8" stroke-width="3" stroke-linecap="round">
    <line x1="286" y1="1030" x2="336" y2="1030"/><line x1="286" y1="1042" x2="326" y2="1042"/><line x1="286" y1="1054" x2="316" y2="1054"/>
    <line x1="286" y1="1126" x2="336" y2="1126"/><line x1="286" y1="1138" x2="326" y2="1138"/><line x1="286" y1="1150" x2="316" y2="1150"/>
  </g>
  <circle cx="508" cy="1042" r="9" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="508" cy="1138" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- NAS → 老路由：数据流（虚线） -->
  <line x1="548" y1="1042" x2="660" y2="1042" stroke="#3B9FE8" stroke-width="3" stroke-dasharray="10 12" opacity="0.55"/>

  <!-- 老路由小方盒 -->
  <rect x="660" y="960" width="220" height="220" rx="28" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="686" cy="986" r="7" fill="#3EE8B0" filter="url(#glowG)"/>
  <circle cx="856" cy="1122" r="30" fill="#0A1826" stroke="#3B9FE8" stroke-width="4"/>

  <!-- 音频线：老路由 → 音箱 -->
  <path d="M 886 1122 C 970 1122 1030 1098 1150 1098" fill="none" stroke="#35D0FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="1010" cy="1109" r="9" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 有源音箱 -->
  <rect x="1150" y="780" width="200" height="400" rx="24" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1250" cy="886" r="42" fill="none" stroke="#3B9FE8" stroke-width="4"/>
  <circle cx="1250" cy="1046" r="76" fill="none" stroke="#3B9FE8" stroke-width="4"/>
  <circle cx="1250" cy="1046" r="34" fill="none" stroke="#3B9FE8" stroke-width="3" opacity="0.7"/>
  <circle cx="1330" cy="1156" r="7" fill="#3EE8B0" filter="url(#glowG)"/>

  <!-- 手机：悬浮遥控器 -->
  <rect x="980" y="240" width="140" height="260" rx="22" fill="#12294D" stroke="#35D0FF" stroke-width="4" filter="url(#glow)"/>
  <line x1="1030" y1="264" x2="1070" y2="264" stroke="#3B9FE8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1032 360 L 1076 386 L 1032 412 Z" fill="#35D0FF" filter="url(#glow)"/>

  <!-- 投送弧：手机 → 老路由方向 -->
  <path d="M 994 561 A 60 60 0 0 0 1106 561" fill="none" stroke="#35D0FF" stroke-width="4" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M 956 574 A 100 100 0 0 0 1144 574" fill="none" stroke="#35D0FF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path d="M 918 588 A 140 140 0 0 0 1182 588" fill="none" stroke="#35D0FF" stroke-width="4" stroke-linecap="round" opacity="0.2"/>

  <!-- 地点标签 -->
  <g font-size="26" fill="#8FAECB" text-anchor="middle" letter-spacing="4">
    <text x="400" y="1246">STORE · 曲库</text>
    <text x="770" y="1246">DECODE · 解码</text>
    <text x="1250" y="1246">PLAY · 发声</text>
  </g>

  <!-- ===== 右侧文字区 ===== -->
  <rect x="1560" y="110" width="500" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1810" y="152" text-anchor="middle" font-size="30" fill="#D6E6F5" letter-spacing="6">数字岛屿 · 声音篇</text>

  <text x="1560" y="430" font-size="148" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">AirPlay</text>
  <text x="1560" y="566" font-size="94" font-weight="800" fill="#FFFFFF" letter-spacing="6">无线 Hi-Fi</text>

  <text x="1560" y="690" font-size="40" fill="#E8F0F8">三件吃灰设备 · <tspan fill="#3EE8B0" filter="url(#glowG)">一根音频线</tspan> · 无感点歌</text>

  <g font-size="30" text-anchor="middle" letter-spacing="2">
    <rect x="1560" y="790" width="360" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="1740" y="832" fill="#BBD4EE">曲库在 NAS</text>
    <rect x="1944" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2134" y="832" fill="#BBD4EE">解码靠老路由</text>
    <rect x="2348" y="790" width="380" height="64" rx="32" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="2538" y="832" fill="#BBD4EE">手机当遥控器</text>
  </g>

  <text x="2768" y="1530" text-anchor="end" font-size="24" fill="#8FAECB" letter-spacing="2">屿华AI · YuHua-AIPlay</text>
</svg>
