<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="1350" height="1800" fill="#F5F9FD"/>
  <circle cx="1300" cy="140" r="220" fill="#E3EEF8" opacity="0.5"/>

  <rect x="80" y="96" width="480" height="56" rx="28" fill="#FFFFFF" stroke="#C9DCEF" stroke-width="1.5"/>
  <text x="320" y="133" text-anchor="middle" font-size="26" letter-spacing="4" fill="#33547A">实测 · 任务栏长这样</text>

  <text x="80" y="290" font-size="80" font-weight="700" fill="#14324F">低电量变红，充电出 <tspan fill="#3E7BD6">⚡</tspan></text>

  <g font-size="27" fill="#33547A">
    <rect x="80" y="350" width="278" height="72" rx="18" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/><text x="219" y="396" text-anchor="middle">≤15% 数字变红</text>
    <rect x="386" y="350" width="278" height="72" rx="18" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/><text x="525" y="396" text-anchor="middle">充电时出 ⚡</text>
    <rect x="692" y="350" width="278" height="72" rx="18" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/><text x="831" y="396" text-anchor="middle">双设备自动标注</text>
    <rect x="998" y="350" width="272" height="72" rx="18" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/><text x="1134" y="396" text-anchor="middle">跟系统亮暗色</text>
  </g>

  <!-- shot 1 -->
  <text x="80" y="500" font-size="30" font-weight="600" fill="#33547A">实拍 · 真实任务栏</text>
  <rect x="80" y="530" width="1190" height="600" rx="26" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="2"/>
  <image href="@SHOT1@" x="110" y="560" width="1130" height="540" preserveAspectRatio="xMidYMid meet"/>

  <!-- shot 2 -->
  <text x="80" y="1230" font-size="30" font-weight="600" fill="#33547A">实拍 · 托盘菜单</text>
  <rect x="80" y="1260" width="1190" height="290" rx="26" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="2"/>
  <image href="@SHOT2@" x="110" y="1290" width="1130" height="230" preserveAspectRatio="xMidYMid meet"/>

  <text x="80" y="1620" font-size="26" fill="#9DBBDA">每块显示器的任务栏都有 · 悬停看详情 · 点击进菜单</text>
  <line x1="80" y1="1660" x2="1270" y2="1660" stroke="#D5E4F0" stroke-width="2"/>
  <text x="80" y="1716" font-size="26" fill="#9DBBDA">屿华AI · YuHua-AIPlay</text>
  <text x="1270" y="1716" text-anchor="end" font-size="26" fill="#9DBBDA">05 / 06</text>
