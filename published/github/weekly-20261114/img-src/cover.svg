  <rect x="840" y="56" width="446" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1063" y="92" text-anchor="middle" font-size="24" letter-spacing="2" fill="#D6E6F5">2026.11.14 · 本期 4 选</text>

  <!-- 标题 -->
