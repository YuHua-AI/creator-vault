    <!-- agent-desktop: 显示器 + 无障碍树节点 + 光标 -->
    <g id="ic-desktop" fill="none" stroke="#35D0FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-52" y="-38" width="104" height="68" rx="8" fill="#12294D"/>
      <line x1="-52" y1="-16" x2="52" y2="-16"/>
      <circle cx="-42" cy="-27" r="2.5" fill="#35D0FF" stroke="none"/>
      <circle cx="-33" cy="-27" r="2.5" fill="#35D0FF" stroke="none"/>
      <circle cx="-24" cy="-27" r="2.5" fill="#3EE8B0" stroke="none"/>
      <circle cx="-34" cy="4" r="5" fill="#3EE8B0" stroke="none"/>
      <circle cx="-6" cy="-4" r="5" fill="#35D0FF" stroke="none"/>
      <circle cx="24" cy="8" r="5" fill="#35D0FF" stroke="none"/>
      <line x1="-30" y1="1" x2="-11" y2="-2"/>
      <line x1="-1" y1="0" x2="19" y2="6"/>
      <line x1="-34" y1="9" x2="-34" y2="20"/>
      <line x1="-34" y1="20" x2="24" y2="20"/>
      <line x1="24" y1="20" x2="24" y2="13"/>
      <path d="M-8 30 L40 30 L22 44 L14 56 Z" fill="#3EE8B0" stroke="none" transform="translate(-8 0) scale(0.8)"/>
