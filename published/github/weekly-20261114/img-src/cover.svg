    <rect x="50" y="426" width="5" height="234" rx="2.5" fill="#3EE8B0" opacity="0.85"/>
    <text x="118" y="510" text-anchor="middle" font-size="56" font-weight="800" fill="#3EE8B0" filter="url(#glowGreen)">01</text>
