    <text x="1226" y="1116" text-anchor="end" font-size="40" font-weight="800" fill="#35D0FF">★60k</text>
    <text x="1226" y="1154" text-anchor="end" font-size="15" letter-spacing="2" fill="#6B8299">PINGDOTGG</text>
  </g>
  <g>
    <rect x="50" y="1294" width="1250" height="262" rx="16" fill="#0D2036" fill-opacity="0.92" stroke="#29527A" stroke-width="1.5"/>
    <rect x="50" y="1308" width="5" height="234" rx="2.5" fill="#35D0FF" opacity="0.85"/>
    <text x="118" y="1392" text-anchor="middle" font-size="56" font-weight="800" fill="#7FA8D0">04</text>
    <line x1="178" y1="1324" x2="178" y2="1526" stroke="#1E3A56" stroke-width="2"/>
    <use href="#ic-hex" transform="translate(252 1425) scale(0.95)"/>
    <text x="330" y="1388" font-size="36" font-weight="700" fill="#FFFFFF">anomalyco/hex</text>
    <text x="330" y="1436" font-size="25" fill="#8FAECB">按住说话松开上屏，本地听写数据不出机</text>
    <rect x="330" y="1462" width="190" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
    <text x="425" y="1485" text-anchor="middle" font-size="19" fill="#9FBFDA">local-first</text>
    <rect x="536" y="1462" width="170" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
    <text x="621" y="1485" text-anchor="middle" font-size="19" fill="#9FBFDA">语音输入</text>
    <text x="1226" y="1410" text-anchor="end" font-size="40" font-weight="800" fill="#35D0FF">★6.6k</text>
    <text x="1226" y="1448" text-anchor="end" font-size="15" letter-spacing="2" fill="#6B8299">ANOMALYCO</text>
