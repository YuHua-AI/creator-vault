  <circle cx="1190" cy="252" r="3.5" fill="#35D0FF" opacity="0.8"/>
  <circle cx="1060" cy="286" r="3" fill="#7FA8D0" opacity="0.6"/>
  <text x="675" y="268" text-anchor="middle" font-size="110" font-weight="800" letter-spacing="6" fill="url(#titleGrad)" filter="url(#glowCyan)">给 Agent 装外设</text>
  <text x="675" y="344" text-anchor="middle" font-size="36" fill="#D6E6F5">4 个开源仓库 · 让 Claude Code 长出<tspan fill="#3EE8B0" font-weight="700">手、眼、耳、遥控器</tspan></text>

