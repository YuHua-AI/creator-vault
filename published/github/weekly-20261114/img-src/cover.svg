<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#16294A"/><stop offset="100%" stop-color="#0A1826"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0FF"/><stop offset="1" stop-color="#3EE8B0"/>
    </linearGradient>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3EE8B0"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-opacity="0.35" stroke-width="1.5"/>
    </pattern>
    <!-- gstack: 虚拟团队 - 三层堆叠 + 人形 -->
    <g id="ic-gstack" fill="none" stroke="#35D0FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-42" y="-34" width="84" height="24" rx="7" fill="#12294D"/>
      <rect x="-42" y="-4" width="84" height="24" rx="7" fill="#12294D"/>
      <rect x="-42" y="26" width="84" height="24" rx="7" fill="#12294D"/>
      <circle cx="-24" cy="-22" r="5" fill="#3EE8B0" stroke="none"/>
      <line x1="-8" y1="-22" x2="28" y2="-22"/>
      <circle cx="-24" cy="8" r="5" fill="#3EE8B0" stroke="none"/>
      <line x1="-8" y1="8" x2="28" y2="8"/>
      <circle cx="-24" cy="38" r="5" fill="#3EE8B0" stroke="none"/>
      <line x1="-8" y1="38" x2="28" y2="38"/>
