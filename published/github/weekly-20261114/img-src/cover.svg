    <text x="1226" y="528" text-anchor="end" font-size="40" font-weight="800" fill="#3EE8B0">★141k</text>
    <text x="1226" y="566" text-anchor="end" font-size="15" letter-spacing="2" fill="#6B8299">GARRYTAN</text>
  </g>
  <g>
    <rect x="50" y="706" width="1250" height="262" rx="16" fill="#0D2036" fill-opacity="0.92" stroke="#29527A" stroke-width="1.5"/>
    <rect x="50" y="720" width="5" height="234" rx="2.5" fill="#3EE8B0" opacity="0.85"/>
