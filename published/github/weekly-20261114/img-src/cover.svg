      <line x1="-56" y1="-10" x2="6" y2="-10"/>
      <line x1="-44" y1="6" x2="-6" y2="6"/>
      <line x1="-44" y1="18" x2="-14" y2="18"/>
      <rect x="16" y="-40" width="38" height="74" rx="8" fill="#12294D"/>
