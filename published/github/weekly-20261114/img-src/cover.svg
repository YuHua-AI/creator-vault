    <text x="330" y="554" font-size="25" fill="#8FAECB">23 个命令，给 Claude Code 配一支虚拟工程团队</text>
    <rect x="330" y="580" width="170" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
    <text x="415" y="603" text-anchor="middle" font-size="19" fill="#9FBFDA">Claude Skills</text>
    <rect x="516" y="580" width="150" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
