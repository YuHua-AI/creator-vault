    <text x="330" y="800" font-size="36" font-weight="700" fill="#FFFFFF">vercel-labs/agent-desktop</text>
    <text x="330" y="848" font-size="25" fill="#8FAECB">不截图不抢鼠标，AI 直接「看见并操作」桌面软件</text>
    <rect x="330" y="874" width="130" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
    <text x="395" y="897" text-anchor="middle" font-size="19" fill="#9FBFDA">MCP</text>
    <rect x="476" y="874" width="170" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
    <text x="561" y="897" text-anchor="middle" font-size="19" fill="#9FBFDA">无障碍树</text>
    <text x="1226" y="822" text-anchor="end" font-size="40" font-weight="800" fill="#3EE8B0">★23.5k</text>
    <text x="1226" y="860" text-anchor="end" font-size="15" letter-spacing="2" fill="#6B8299">VERCEL LABS</text>
  </g>
  <g>
    <rect x="50" y="1000" width="1250" height="262" rx="16" fill="#0D2036" fill-opacity="0.92" stroke="#29527A" stroke-width="1.5"/>
    <rect x="50" y="1014" width="5" height="234" rx="2.5" fill="#35D0FF" opacity="0.85"/>
