    <line x1="178" y1="1030" x2="178" y2="1232" stroke="#1E3A56" stroke-width="2"/>
    <use href="#ic-t3" transform="translate(252 1131) scale(0.95)"/>
    <text x="330" y="1094" font-size="36" font-weight="700" fill="#FFFFFF">pingdotgg/t3code</text>
    <text x="330" y="1142" font-size="25" fill="#8FAECB">电脑上开工，手机上批活——编码 Agent 的遥控器</text>
    <rect x="330" y="1168" width="190" height="34" rx="17" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.2"/>
