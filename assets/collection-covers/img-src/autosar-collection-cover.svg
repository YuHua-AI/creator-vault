<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <!-- A 工程蓝图：AUTOSAR 合集封面（竖图 3:4，架构本体版） -->
  <defs>
    <pattern id="gp" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1440" fill="#0E2A47"/>
  <rect width="1080" height="1440" fill="url(#gp)"/>
  <rect x="36" y="36" width="1008" height="1368" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="54" y="54" width="972" height="1332" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="90" y="200" fill="#9FC3E8" font-size="34" letter-spacing="8">汽车软件 · 标准架构</text>
  <line x1="90" y1="230" x2="560" y2="230" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="340" fill="#F4F9FE" font-size="96" font-weight="800">AUTOSAR</text>
  <text x="90" y="450" fill="#F4F9FE" font-size="96" font-weight="800">入 门</text>
  <text x="90" y="530" fill="#E8A44C" font-size="38">把一辆车的软件，拆成标准积木</text>

  <!-- 分层架构堆叠 -->
  <g font-size="30" text-anchor="middle">
    <rect x="150" y="640" width="780" height="96" rx="8" fill="#0B2440" stroke="#7FB2E8" stroke-width="2.5"/>
    <text x="540" y="700" fill="#F4F9FE">应用层 · SWC 软件组件</text>

    <rect x="150" y="760" width="780" height="96" rx="8" fill="#123A63" stroke="#E8A44C" stroke-width="2.5"/>
    <text x="540" y="820" fill="#E8A44C">RTE · 运行时环境（虚拟总线）</text>

    <rect x="150" y="880" width="780" height="96" rx="8" fill="#0B2440" stroke="#7FB2E8" stroke-width="2.5"/>
    <text x="540" y="940" fill="#F4F9FE">基础软件 BSW · 服务/ECU/通信/存储</text>

    <rect x="150" y="1000" width="780" height="96" rx="8" fill="#0B2440" stroke="#7FB2E8" stroke-width="2.5"/>
    <text x="540" y="1060" fill="#F4F9FE">MCAL · 微控制器抽象</text>

    <rect x="150" y="1120" width="780" height="96" rx="8" fill="#1B3A6B" stroke="#9FC3E8" stroke-width="2.5"/>
    <text x="540" y="1180" fill="#9FC3E8">硬件 · 车规级 MCU</text>
  </g>
  <!-- 层间连接 -->
  <g stroke="#9FC3E8" stroke-opacity="0.6" stroke-width="2">
    <line x1="540" y1="736" x2="540" y2="760"/>
    <line x1="540" y1="856" x2="540" y2="880"/>
    <line x1="540" y1="976" x2="540" y2="1000"/>
    <line x1="540" y1="1096" x2="540" y2="1120"/>
  </g>

  <text x="90" y="1330" fill="#F4F9FE" font-size="40" font-weight="700">协议是 ISO 的，实现是 <tspan fill="#E8A44C">AUTOSAR 的</tspan></text>

  <!-- 图纸角标（右上） -->
  <g font-size="24" fill="#9FC3E8">
    <rect x="740" y="150" width="270" height="110" fill="none" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
    <text x="762" y="192">FIG. SERIES COVER</text>
    <text x="762" y="232">CLASSIC PLATFORM</text>
    <text x="950" y="192">REV. 3.0</text>
    <text x="950" y="232">SHEET 01</text>
  </g>
</svg>
