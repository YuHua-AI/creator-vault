<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16294A"/><stop offset="100%" stop-color="#0A1826"/>
    </radialGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3EE8B0"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-opacity="0.35" stroke-width="1.5"/>
    </pattern>
    <g id="ic-wrench" fill="none" stroke="#35D0FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M24 -34 Q4 -30 -2 -12 Q-6 -2 -14 6 L-30 22 Q-36 28 -30 34 Q-24 40 -18 34 L-2 18 Q6 10 16 6 Q32 0 34 -20 Z" fill="#12294D"/>
      <circle cx="-26" cy="26" r="5" fill="#3EE8B0" stroke="none"/></g>
  </defs>

  <rect width="1350" height="1800" fill="url(#bgGlow)"/>
  <rect width="1350" height="1800" fill="url(#grid)"/>
  <ellipse cx="240" cy="1560" rx="480" ry="300" fill="#14405E" opacity="0.28"/>
  <circle cx="1200" cy="180" r="3" fill="#7FA8D0" opacity="0.45"/>
  <circle cx="130" cy="760" r="2.5" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1240" cy="980" r="2.5" fill="#7FA8D0" opacity="0.35"/>

  <!-- 顶部胶囊 -->
  <rect x="64" y="64" width="470" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="299" y="100" text-anchor="middle" font-size="26" letter-spacing="5" fill="#D6E6F5">GITHUB WEEKLY · 开源周榜</text>
  <text x="64" y="152" font-size="20" letter-spacing="2" fill="#4E6A85">统计周期 2026.11.03 – 11.08</text>
  <rect x="1074" y="64" width="212" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.8"/>
  <text x="1180" y="101" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3" fill="#7FA8D0">NO.06</text>

  <!-- 图标 -->
  <use href="#ic-wrench" x="675" y="330" transform="translate(675 330) scale(1.75) translate(-675 -330)"/>

  <!-- 项目名 -->
  <text x="675" y="492" text-anchor="middle" font-size="30" letter-spacing="3" fill="#6B8299">storytold</text>
  <text x="675" y="590" text-anchor="middle" font-size="76" font-weight="800" fill="#FFFFFF">craft-anything</text>

  <!-- 定位句 -->
  <text x="675" y="706" text-anchor="middle" font-size="46" font-weight="700" fill="#3EE8B0" filter="url(#glowGreen)">看懂它，然后复刻它</text>

  <!-- 分隔线 -->
  <line x1="220" y1="768" x2="1130" y2="768" stroke="#29527A" stroke-width="2"/>
  <circle cx="675" cy="768" r="6" fill="#0A1826" stroke="#35D0FF" stroke-width="2.5"/>

  <!-- 描述 -->
  <text x="675" y="846" text-anchor="middle" font-size="30" fill="#B8CCDF">ArtCraft 桌面应用：Study 拆解原件 → Build 按你的</text>
  <text x="675" y="900" text-anchor="middle" font-size="30" fill="#B8CCDF">技术栈重建 → Check 对比差距 → Ready 交付。</text>
  <text x="675" y="954" text-anchor="middle" font-size="30" fill="#B8CCDF">320 个工具，每个都是 CLI + MCP 双形态。</text>

  <!-- 数据 2×2 -->
  <rect x="110" y="1000" width="550" height="104" rx="16" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
      <text x="385" y="1038" text-anchor="middle" font-size="22" letter-spacing="3" fill="#6B8299">总星标</text>
      <text x="385" y="1084" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">7.7k</text>
<rect x="690" y="1000" width="550" height="104" rx="16" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
      <text x="965" y="1038" text-anchor="middle" font-size="22" letter-spacing="3" fill="#6B8299">周增长</text>
      <text x="965" y="1084" text-anchor="middle" font-size="42" font-weight="700" fill="#3EE8B0">+3836</text>
<rect x="110" y="1124" width="550" height="104" rx="16" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
      <text x="385" y="1162" text-anchor="middle" font-size="22" letter-spacing="3" fill="#6B8299">开源时间</text>
      <text x="385" y="1208" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">2026-11-03</text>
<rect x="690" y="1124" width="550" height="104" rx="16" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
      <text x="965" y="1162" text-anchor="middle" font-size="22" letter-spacing="3" fill="#6B8299">主语言</text>
      <text x="965" y="1208" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">Rust</text>

  <!-- 标签 -->
  <rect x="389.6" y="1306" width="174.2" height="56" rx="28" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
      <text x="476.8" y="1344" text-anchor="middle" font-size="28" fill="#D6E6F5">桌面应用</text><rect x="587.9" y="1306" width="174.2" height="56" rx="28" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
      <text x="675.0" y="1344" text-anchor="middle" font-size="28" fill="#D6E6F5">Rust</text><rect x="786.1" y="1306" width="174.2" height="56" rx="28" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
      <text x="873.2" y="1344" text-anchor="middle" font-size="28" fill="#D6E6F5">复刻软件</text>

  <!-- 底部 -->
  <line x1="64" y1="1656" x2="1286" y2="1656" stroke="#1E3A56" stroke-width="2"/>
  <text x="64" y="1712" font-size="26" letter-spacing="3" fill="#8FAECB">屿华AI · YuHua-AIPlay</text>
  <text x="1286" y="1712" text-anchor="end" font-size="24" fill="#4E6A85">github.com/storytold/craft-anything</text>
</svg>
