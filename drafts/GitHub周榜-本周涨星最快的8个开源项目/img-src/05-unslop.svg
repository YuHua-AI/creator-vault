<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16294A"/><stop offset="100%" stop-color="#0A1826"/>
    </radialGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3EE8B0"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-opacity="0.35" stroke-width="1.5"/>
    </pattern>
    <g id="ic-uiwin" fill="none" stroke="#35D0FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-46" y="-32" width="92" height="64" rx="8" fill="#12294D"/>
      <line x1="-46" y1="-12" x2="46" y2="-12"/>
      <circle cx="-36" cy="-22" r="2.5" fill="#35D0FF" stroke="none"/><circle cx="-27" cy="-22" r="2.5" fill="#35D0FF" stroke="none"/><circle cx="-18" cy="-22" r="2.5" fill="#3EE8B0" stroke="none"/>
      <rect x="-34" y="-2" width="32" height="26" rx="4" fill="#3EE8B0" fill-opacity="0.25" stroke="#3EE8B0"/>
      <line x1="6" y1="2" x2="34" y2="2"/><line x1="6" y1="14" x2="26" y2="14"/><line x1="6" y1="26" x2="34" y2="26"/></g>
  </defs>

  <rect width="1350" height="1800" fill="url(#bgGlow)"/>
  <rect width="1350" height="1800" fill="url(#grid)"/>
  <ellipse cx="240" cy="1600" rx="480" ry="300" fill="#14405E" opacity="0.28"/>
  <circle cx="1200" cy="180" r="3" fill="#7FA8D0" opacity="0.45"/>
  <circle cx="130" cy="760" r="2.5" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1240" cy="980" r="2.5" fill="#7FA8D0" opacity="0.35"/>

  <!-- 顶部胶囊 -->
  <rect x="64" y="56" width="470" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="299" y="92" text-anchor="middle" font-size="26" letter-spacing="5" fill="#D6E6F5">GITHUB WEEKLY · 开源周榜</text>
  <text x="64" y="146" font-size="20" letter-spacing="2" fill="#4E6A85">统计周期 2026.11.03 – 11.08</text>
  <rect x="1074" y="56" width="212" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.8"/>
  <text x="1180" y="93" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3" fill="#7FA8D0">NO.05</text>

  <!-- 专属图标 -->
  <use href="#ic-uiwin" transform="translate(675 305) scale(1.6)"/>

  <!-- 标题 + 作者/仓库小字 -->
  <text x="675" y="505" text-anchor="middle" font-size="72" font-weight="800" fill="#FFFFFF">去 AI 味界面术</text>
  <text x="675" y="562" text-anchor="middle" font-size="26" letter-spacing="1" fill="#8FAECB">heydamir / unslop · JavaScript</text>

  <!-- 一句话介绍 -->
  <text x="675" y="655" text-anchor="middle" font-size="46" font-weight="700" fill="#3EE8B0" filter="url(#glowGreen)">去掉界面的一眼 AI 味</text>

  <!-- 星数 -->
  <rect x="65" y="706" width="560" height="140" rx="18" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
  <text x="345" y="748" text-anchor="middle" font-size="20" letter-spacing="6" fill="#6B8299">总星标 TOTAL</text>
  <text x="345" y="816" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF"><tspan fill="#35D0FF">★</tspan> 7.3k</text>
  <rect x="725" y="706" width="560" height="140" rx="18" fill="#0E2038" fill-opacity="0.9" stroke="#3EE8B0" stroke-opacity="0.55" stroke-width="1.8"/>
  <text x="1005" y="748" text-anchor="middle" font-size="20" letter-spacing="6" fill="#6B8299">本周增长 WEEKLY</text>
  <text x="1005" y="816" text-anchor="middle" font-size="56" font-weight="800" fill="#3EE8B0" filter="url(#glowGreen)">▲ 3,945</text>

  <!-- 分隔线 -->
  <line x1="220" y1="880" x2="1130" y2="880" stroke="#29527A" stroke-width="2"/>
  <circle cx="675" cy="880" r="6" fill="#0A1826" stroke="#35D0FF" stroke-width="2.5"/>

  <!-- 正文三段 -->
  <rect x="110" y="952" width="116" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="168" y="981" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">是什么</text>
    <text x="110" y="1044" font-size="27" fill="#B8CCDF">一份通用界面设计技能，专治「一眼 AI」的模板脸：</text>
  <text x="110" y="1090" font-size="27" fill="#B8CCDF">紫色渐变、到处发光、emoji 堆砌。</text>
  <rect x="110" y="1168" width="140" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="180" y="1197" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">能做什么</text>
    <text x="110" y="1260" font-size="27" fill="#B8CCDF">先揪出界面里的 slop 套路，再按你的产品气质</text>
  <text x="110" y="1306" font-size="27" fill="#B8CCDF">重新定方向，把整个界面修出性格。</text>
  <rect x="110" y="1384" width="116" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="168" y="1413" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">适合谁</text>
    <text x="110" y="1476" font-size="27" fill="#B8CCDF">用 AI 做产品、却总被用户吐槽「太 AI」的</text>
  <text x="110" y="1522" font-size="27" fill="#B8CCDF">独立开发者与设计师。</text>

  <!-- 标签 -->
  <rect x="264.0" y="1564" width="374.2" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="451.1" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">Claude Skill</text><rect x="660.3" y="1564" width="188.6" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="754.6" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">UI 设计</text><rect x="870.9" y="1564" width="215.1" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="978.4" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">反 AI 味</text>

  <!-- 底部 -->
  <line x1="64" y1="1664" x2="1286" y2="1664" stroke="#1E3A56" stroke-width="2"/>
  <text x="64" y="1722" font-size="26" letter-spacing="3" fill="#8FAECB">屿华AI · YuHua-AIPlay</text>
  <text x="1286" y="1722" text-anchor="end" font-size="24" fill="#4E6A85">github.com/heydamir/unslop</text>
</svg>
