<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'Consolas','Menlo','Courier New',monospace">
  <!-- 终端风：superpowers 证据链实拍（真实目录与真实数字） -->
  <defs>
    <linearGradient id="bar8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D333B"/>
      <stop offset="1" stop-color="#22272E"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="1350" fill="#0D1117"/>

  <rect x="60" y="60" width="2280" height="90" rx="18" fill="url(#bar8)"/>
  <circle cx="130" cy="105" r="16" fill="#FF5F57"/>
  <circle cx="180" cy="105" r="16" fill="#FEBC2E"/>
  <circle cx="230" cy="105" r="16" fill="#28C840"/>
  <text x="1200" y="118" fill="#8B949E" font-size="30" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">协作开发的证据链 —— 真实目录、真实数字，过程文档全部留档</text>

  <g font-size="28">
    <text x="110" y="230" fill="#3EE8B0">PS&gt; ls docs/superpowers/specs/ ; ls docs/superpowers/plans/</text>
    <text x="110" y="295" fill="#F4F9FE">2026-09-18-configs-testcase-split-design.md</text>
    <text x="110" y="350" fill="#F4F9FE">2026-09-19-dem-fault-report-design.md</text>
    <text x="110" y="405" fill="#F4F9FE">2026-10-08-cxcanfd-driver-design.md</text>
    <text x="110" y="460" fill="#F4F9FE">2026-11-03-diagnostic-tester-ui-design.md</text>
    <text x="110" y="515" fill="#8B949E">  + plans/ 下同名四份实施计划</text>

    <text x="110" y="600" fill="#3EE8B0">PS&gt; python -m pytest tests/ -q</text>
    <text x="110" y="665" fill="#3EE8B0" font-weight="bold">255 passed in 11.10s</text>

    <text x="110" y="750" fill="#3EE8B0">PS&gt; (Get-ChildItem *.py | Measure-Object -Line).Lines</text>
  </g>

  <!-- 数字卡片行 -->
  <g text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(370,960)">
      <rect x="-250" y="-90" width="500" height="180" rx="12" fill="#161B22" stroke="#3EE8B0" stroke-width="2.5"/>
      <text y="-20" fill="#3EE8B0" font-size="52" font-weight="800" font-family="'Consolas',monospace">4 组</text>
      <text y="45" fill="#8B949E" font-size="26">design + plan 成对留档</text>
    </g>
    <g transform="translate(900,960)">
      <rect x="-250" y="-90" width="500" height="180" rx="12" fill="#161B22" stroke="#58A6FF" stroke-width="2.5"/>
      <text y="-20" fill="#58A6FF" font-size="52" font-weight="800" font-family="'Consolas',monospace">6466 行</text>
      <text y="45" fill="#8B949E" font-size="26">过程文档总行数</text>
    </g>
    <g transform="translate(1430,960)">
      <rect x="-250" y="-90" width="500" height="180" rx="12" fill="#161B22" stroke="#E8A44C" stroke-width="2.5"/>
      <text y="-20" fill="#E8A44C" font-size="52" font-weight="800" font-family="'Consolas',monospace">148 个</text>
      <text y="45" fill="#8B949E" font-size="26">plan 勾选框任务</text>
    </g>
    <g transform="translate(1960,960)">
      <rect x="-250" y="-90" width="500" height="180" rx="12" fill="#161B22" stroke="#F4F9FE" stroke-width="2.5"/>
      <text y="-20" fill="#F4F9FE" font-size="52" font-weight="800" font-family="'Consolas',monospace">3380 行</text>
      <text y="45" fill="#8B949E" font-size="26">测试代码（源码 2380 行）</text>
    </g>
  </g>

  <text x="110" y="1180" fill="#58A6FF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28">测试比源码还多 40%——AI 写实现，测试先行是工作流的硬约束，不是口号。</text>

  <g font-size="22" fill="#8B949E">
    <text x="2220" y="1290" text-anchor="end">FIG. AI-1 · REAL EVIDENCE · 2026</text>
  </g>
</svg>
