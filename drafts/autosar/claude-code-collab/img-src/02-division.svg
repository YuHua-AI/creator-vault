<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 分节图：人机分工 -->
  <defs>
    <pattern id="g9" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="#0E2A47"/>
  <rect width="2400" height="1350" fill="url(#g9)"/>
  <rect x="40" y="40" width="2320" height="1270" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="60" y="60" width="2280" height="1230" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="120" y="150" fill="#9FC3E8" font-size="32" letter-spacing="8">DIVISION · 人机分工</text>
  <line x1="120" y1="175" x2="720" y2="175" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
  <text x="120" y="240" fill="#F4F9FE" font-size="54" font-weight="800">AI 负责从「事实+标准」到代码，人负责决定什么是事实</text>

  <!-- 左：AI 侧 -->
  <g transform="translate(180,320)">
    <rect x="0" y="0" width="940" height="780" rx="14" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
    <text x="45" y="80" fill="#7FB2E8" font-size="38" font-weight="800">AI（Claude Code）</text>
    <text x="45" y="135" fill="#6E96C2" font-size="27">输入是「明确的事实 + 明确的标准」</text>
    <line x1="45" y1="170" x2="895" y2="170" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g fill="#F4F9FE" font-size="29">
      <text x="45" y="240">规范 → 实现：ISO 14229 / 15765-2</text>
      <text x="45" y="315">设计 → 代码：按 plan 逐任务 TDD</text>
      <text x="45" y="390">重构 → 全绿：255 用例 11 秒回归</text>
      <text x="45" y="465">文档 → 留档：design / plan 自动沉淀</text>
    </g>
    <rect x="45" y="530" width="850" height="170" rx="10" fill="#123A63" stroke="#7FB2E8" stroke-width="2"/>
    <text x="70" y="595" fill="#9FC3E8" font-size="27">为什么跑得快：协议标准化、测试免硬件、</text>
    <text x="70" y="645" fill="#9FC3E8" font-size="27">结果可断言、需求文本化——四个性质全部在工具里</text>
  </g>

  <!-- 右：人侧 -->
  <g transform="translate(1280,320)">
    <rect x="0" y="0" width="940" height="780" rx="14" fill="#123A63" stroke="#E8A44C" stroke-width="3"/>
    <text x="45" y="80" fill="#E8A44C" font-size="38" font-weight="800">人（诊断工程师）</text>
    <text x="45" y="135" fill="#6E96C2" font-size="27">三类判断，牢牢握在手里</text>
    <line x1="45" y1="170" x2="895" y2="170" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g fill="#F4F9FE" font-size="29">
      <text x="45" y="240" font-weight="800">① 协议事实的裁决</text>
      <text x="45" y="290" fill="#9FC3E8" font-size="26">AI 记忆可能有偏差，以 ISO 14229 为准，人核对</text>
      <text x="45" y="375" font-weight="800">② 工程取舍的拍板</text>
      <text x="45" y="425" fill="#9FC3E8" font-size="26">可复现性 &gt; 便利性——判断来自踩坑经验</text>
      <text x="45" y="510" font-weight="800">③ 安全边界的划定</text>
      <text x="45" y="560" fill="#9FC3E8" font-size="26">密钥只走本地配置，演示全走 Mock 数据</text>
    </g>
    <rect x="45" y="630" width="850" height="100" rx="10" fill="#0B2440" stroke="#E8A44C" stroke-width="2"/>
    <text x="70" y="692" fill="#E8A44C" font-size="28">决定什么是事实、什么算好</text>
  </g>

  <!-- 中间握手箭头 -->
  <g stroke="#E8A44C" stroke-width="3" fill="none">
    <path d="M1130,700 L1270,700 M1270,700 L1242,684 M1270,700 L1242,716"/>
  </g>

  <!-- 底部结论条 -->
  <rect x="180" y="1130" width="2040" height="110" rx="12" fill="#0B2440" stroke="#DCE9F5" stroke-width="2"/>
  <text x="1200" y="1197" fill="#F4F9FE" font-size="30" font-weight="800" text-anchor="middle">人在环上的位置从「执行者」变成「审核者」——本系列五篇文章，就是同一范式在写作领域的演练</text>

  <!-- 图纸角标 -->
  <g font-size="22" fill="#9FC3E8">
    <rect x="1810" y="1190" width="500" height="80" fill="none" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="1810" y1="1230" x2="2310" y2="1230" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="2080" y1="1190" x2="2080" y2="1270" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1830" y="1218">FIG. AI-2</text>
    <text x="1830" y="1258">WHO DECIDES WHAT</text>
    <text x="2100" y="1218">REV. 2026</text>
    <text x="2100" y="1258">SHEET 02</text>
  </g>
</svg>
