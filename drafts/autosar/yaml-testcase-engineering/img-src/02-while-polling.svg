<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 分节图：while 轮询时序 -->
  <defs>
    <pattern id="g6" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="#0E2A47"/>
  <rect width="2400" height="1350" fill="url(#g6)"/>
  <rect x="40" y="40" width="2320" height="1270" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="60" y="60" width="2280" height="1230" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="120" y="150" fill="#9FC3E8" font-size="32" letter-spacing="8">WHILE POLLING · 轮询步骤语义</text>
  <line x1="120" y1="175" x2="720" y2="175" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
  <text x="120" y="240" fill="#F4F9FE" font-size="54" font-weight="800">语义收得很窄：命中前缀才续轮，三种情况一律跳出</text>

  <!-- 生命线 -->
  <rect x="400" y="330" width="340" height="90" rx="10" fill="#123A63" stroke="#F4F9FE" stroke-width="3"/>
  <text x="570" y="390" fill="#F4F9FE" font-size="36" font-weight="800" text-anchor="middle">Tester</text>
  <line x1="570" y1="420" x2="570" y2="1140" stroke="#DCE9F5" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="1660" y="330" width="340" height="90" rx="10" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
  <text x="1830" y="390" fill="#F4F9FE" font-size="36" font-weight="800" text-anchor="middle">ECU</text>
  <line x1="1830" y1="420" x2="1830" y2="1140" stroke="#DCE9F5" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 循环框 -->
  <rect x="330" y="470" width="1840" height="380" rx="14" fill="none" stroke="#E8A44C" stroke-width="2.5" stroke-dasharray="14 8"/>
  <rect x="350" y="440" width="330" height="60" rx="8" fill="#E8A44C"/>
  <text x="515" y="482" fill="#0E2A47" font-size="28" font-weight="800" text-anchor="middle" font-family="'Consolas','Menlo',monospace">loop ≤ max_cycles</text>

  <!-- 循环内消息 -->
  <g transform="translate(0,540)">
    <line x1="570" y1="0" x2="1830" y2="0" stroke="#E8A44C" stroke-width="3"/>
    <polygon points="1830,0 1798,-12 1798,12" fill="#E8A44C"/>
    <text x="1200" y="-14" fill="#F4F9FE" font-size="30" text-anchor="middle" font-family="'Consolas','Menlo',monospace">31 03 FF00　（第 1 轮）</text>
  </g>
  <g transform="translate(0,650)">
    <line x1="1830" y1="0" x2="570" y2="0" stroke="#E8A44C" stroke-width="3"/>
    <polygon points="570,0 602,-12 602,12" fill="#E8A44C"/>
    <text x="1200" y="-14" fill="#F4F9FE" font-size="30" text-anchor="middle" font-family="'Consolas','Menlo',monospace">71 03 FF00 01</text>
    <text x="700" y="40" fill="#9FC3E8" font-size="26">命中 in_progress 前缀 → 等 delay_ms → 重发同一请求</text>
  </g>
  <g transform="translate(0,770)">
    <line x1="570" y1="0" x2="1830" y2="0" stroke="#E8A44C" stroke-width="3"/>
    <polygon points="1830,0 1798,-12 1798,12" fill="#E8A44C"/>
    <text x="1200" y="-14" fill="#F4F9FE" font-size="30" text-anchor="middle" font-family="'Consolas','Menlo',monospace">31 03 FF00　（第 2 轮 · 循环）</text>
  </g>

  <!-- 跳出消息 -->
  <g transform="translate(0,900)">
    <line x1="1830" y1="0" x2="570" y2="0" stroke="#3EE8B0" stroke-width="3"/>
    <polygon points="570,0 602,-12 602,12" fill="#3EE8B0"/>
    <text x="1200" y="-14" fill="#3EE8B0" font-size="30" text-anchor="middle" font-family="'Consolas','Menlo',monospace">71 03 FF00 00</text>
    <text x="700" y="40" fill="#3EE8B0" font-size="26">不再命中 → 跳出，按 expect 判定</text>
  </g>

  <!-- 右侧：三条跳出规则 -->
  <g transform="translate(0,0)">
    <rect x="120" y="480" width="440" height="560" rx="12" fill="#0B2440" stroke="#7FB2E8" stroke-width="2.5"/>
    <text x="150" y="540" fill="#9FC3E8" font-size="30" font-weight="800">跳出即判定</text>
    <line x1="150" y1="565" x2="530" y2="565" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g fill="#F4F9FE" font-size="26">
      <text x="150" y="620" fill="#3EE8B0">✓ 响应变化</text>
      <text x="150" y="660" font-size="24" fill="#9FC3E8">按 expect 正常判定</text>
      <text x="150" y="730" fill="#3EE8B0">✓ 单轮超时</text>
      <text x="150" y="770" font-size="24" fill="#9FC3E8">跳出判 TIMEOUT——掉线不被</text>
      <text x="150" y="806" font-size="24" fill="#9FC3E8">轮询掩盖成无限等待</text>
      <text x="150" y="876" fill="#3EE8B0">✓ max_cycles 到顶</text>
      <text x="150" y="916" font-size="24" fill="#9FC3E8">按 expect 判定（通常 FAIL），</text>
      <text x="150" y="952" font-size="24" fill="#9FC3E8">用例不挂死占着台架</text>
      <text x="150" y="1020" fill="#6E96C2" font-size="24">日志记「while: 共 N 次请求」</text>
    </g>
  </g>

  <!-- 图纸角标 -->
  <g font-size="22" fill="#9FC3E8">
    <rect x="1810" y="1190" width="500" height="80" fill="none" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="1810" y1="1230" x2="2310" y2="1230" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="2080" y1="1190" x2="2080" y2="1270" stroke="#DCE9F5" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1830" y="1218">FIG. TC-3</text>
    <text x="1830" y="1258">POLL LOOP</text>
    <text x="2100" y="1218">REV. 2026</text>
    <text x="2100" y="1258">SHEET 02</text>
  </g>
</svg>
