<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 封面：UDS 诊断测试工具的设计与实现 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 实战 · 诊断工具 ①</text>
  <text x="160" y="340" fill="#F4F9FE" font-size="92" font-weight="800">写一个自己的 UDS 诊断测试工具</text>
  <text x="160" y="440" fill="#9FC3E8" font-size="52">Python + USB-CANFD · 四层架构 · YAML 测试用例</text>
  <line x1="160" y1="480" x2="2560" y2="480" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 左：YAML 用例卡 -->
  <g transform="translate(160,580)">
    <rect x="0" y="0" width="740" height="820" rx="14" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
    <text x="40" y="70" fill="#9FC3E8" font-family="'Consolas','Menlo',monospace" font-size="30">testcase.yaml</text>
    <line x1="40" y1="95" x2="700" y2="95" stroke="#DCE9F5" stroke-opacity="0.35" stroke-width="1.5"/>
    <g font-family="'Consolas','Menlo',monospace" font-size="29" fill="#F4F9FE">
      <text x="40" y="160">steps:</text>
      <text x="40" y="225">  - name: <tspan fill="#E8A44C">进扩展会话</tspan></text>
      <text x="40" y="290">    request: <tspan fill="#7FB2E8">"1003"</tspan></text>
      <text x="40" y="355">    expect: <tspan fill="#7FB2E8">"6203"</tspan></text>
      <text x="40" y="420">  - name: <tspan fill="#E8A44C">读软件版本</tspan></text>
      <text x="40" y="485">    request: <tspan fill="#7FB2E8">"22F195"</tspan></text>
      <text x="40" y="550">    expect: <tspan fill="#7FB2E8">"62F195"</tspan></text>
      <text x="40" y="615">on_fail: <tspan fill="#7FB2E8">abort</tspan></text>
    </g>
    <text x="40" y="720" fill="#6E96C2" font-size="26">用例只写「测什么」</text>
    <text x="40" y="770" fill="#6E96C2" font-size="26">换项目 = 换一份配置</text>
  </g>

  <!-- 中：四层协议栈 -->
  <g transform="translate(1050,580)" text-anchor="middle">
    <g transform="translate(0,90)">
      <rect x="-370" y="-80" width="740" height="160" rx="12" fill="#123A63" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-18" fill="#F4F9FE" font-size="40" font-weight="800">流程引擎</text>
      <text y="45" fill="#9FC3E8" font-size="27">steps · 判定 · 轮询 · 断言</text>
    </g>
    <g transform="translate(0,310)">
      <rect x="-370" y="-80" width="740" height="160" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-18" fill="#F4F9FE" font-size="40" font-weight="800">UDS 会话层</text>
      <text y="45" fill="#9FC3E8" font-size="27">请求/响应 · NRC · 0x78 · P2 / P2*</text>
    </g>
    <g transform="translate(0,530)">
      <rect x="-370" y="-80" width="740" height="160" rx="12" fill="#0B2440" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-18" fill="#F4F9FE" font-size="40" font-weight="800">ISO-TP 传输层 · 15765-2</text>
      <text y="45" fill="#9FC3E8" font-size="27">SF/FF/CF/FC · BS/STmin · N_Bs / N_Cr</text>
    </g>
    <g transform="translate(0,750)">
      <rect x="-370" y="-80" width="740" height="160" rx="12" fill="#123A63" stroke="#F4F9FE" stroke-width="3"/>
      <text y="-18" fill="#F4F9FE" font-size="40" font-weight="800">CAN 驱动抽象</text>
      <text y="45" fill="#9FC3E8" font-size="27">send / recv · 周立功 · 创芯 · Mock</text>
    </g>
  </g>

  <!-- 右：卡与 ECU -->
  <g transform="translate(2334,750)" text-anchor="middle">
    <rect x="-310" y="-100" width="620" height="200" rx="14" fill="#0B2440" stroke="#F4F9FE" stroke-width="3.5"/>
    <text y="-18" fill="#F4F9FE" font-size="44" font-weight="800">USB-CANFD 卡</text>
    <text y="55" fill="#9FC3E8" font-size="28">经典 CAN / CAN FD</text>
  </g>
  <g transform="translate(2334,1190)" text-anchor="middle">
    <rect x="-310" y="-100" width="620" height="200" rx="14" fill="#0B2440" stroke="#F4F9FE" stroke-width="3.5"/>
    <text y="-18" fill="#F4F9FE" font-size="44" font-weight="800">ECU</text>
    <text y="55" fill="#9FC3E8" font-size="28">UDS Server · 真件或 Mock</text>
  </g>
  <line x1="2334" y1="850" x2="2334" y2="1090" stroke="#DCE9F5" stroke-opacity="0.75" stroke-width="3"/>
  <text x="2380" y="980" fill="#9FC3E8" font-size="26">CAN 总线</text>

  <!-- 连接箭头 -->
  <g stroke="#E8A44C" stroke-width="3" fill="none">
    <path d="M920,980 L1040,980"/><path d="M1040,980 L1012,962 M1040,980 L1012,998"/>
    <path d="M1790,660 L2000,660"/><path d="M2000,660 L1972,642 M2000,660 L1972,678"/>
  </g>
  <text x="955" y="940" fill="#E8A44C" font-size="26">配置 / 用例注入</text>
  <text x="1808" y="620" fill="#E8A44C" font-size="26">帧</text>

  <!-- 底部注脚 -->
  <text x="160" y="1500" fill="#6E96C2" font-size="28">ISO 14229 UDS · ISO 15765-2 ISO-TP</text>
  <text x="2688" y="1500" fill="#6E96C2" font-size="28" text-anchor="end">CLI · GUI · Mock 免硬件 · BLF 回放</text>
</svg>
