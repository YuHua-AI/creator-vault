<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'Songti SC','Noto Serif SC','PingFang SC',serif">
  <!-- C 技术手册：报文字段格式 -->
  <rect width="2400" height="1350" fill="#F7F5F0"/>
  <line x1="120" y1="130" x2="2280" y2="130" stroke="#1B3A6B" stroke-width="5"/>
  <line x1="120" y1="144" x2="2280" y2="144" stroke="#1B3A6B" stroke-width="2"/>
  <text x="120" y="106" fill="#1B3A6B" font-size="36" font-weight="700" letter-spacing="4">读 VIN 的报文格式</text>
  <text x="2280" y="106" fill="#B3541E" font-size="36" text-anchor="end">ISO 14229-1:2020 §11.2</text>

  <!-- ① 请求 -->
  <text x="120" y="250" fill="#1B3A6B" font-size="40" font-weight="700">Figure 1　请求：ReadDataByIdentifier（0x22）</text>
  <g font-size="46" font-weight="700" text-anchor="middle">
    <rect x="160" y="290" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="310" y="372" fill="#1B3A6B">22</text>
    <rect x="460" y="290" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="610" y="372" fill="#1B3A6B">F1</text>
    <rect x="760" y="290" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="910" y="372" fill="#1B3A6B">90</text>
    <text x="1120" y="372" fill="#3D4A5C" font-size="36">…可连续请求多个 DID</text>
  </g>
  <g font-size="30" fill="#3D4A5C" text-anchor="middle">
    <line x1="310" y1="420" x2="310" y2="470" stroke="#8A94A6" stroke-width="2"/>
    <text x="310" y="508">SID</text>
    <line x1="610" y1="420" x2="610" y2="470" stroke="#8A94A6" stroke-width="2"/>
    <line x1="910" y1="420" x2="910" y2="470" stroke="#8A94A6" stroke-width="2"/>
    <text x="760" y="508">DID ＝ F190（高位 F1 · 低位 90）</text>
  </g>

  <!-- ② 正应答 -->
  <text x="120" y="650" fill="#1B3A6B" font-size="40" font-weight="700">Figure 2　正应答：SID + 0x40 ＝ 0x62</text>
  <g font-size="46" font-weight="700" text-anchor="middle">
    <rect x="160" y="690" width="300" height="130" fill="#1B3A6B"/>
    <text x="310" y="772" fill="#F7F5F0">62</text>
    <rect x="460" y="690" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="610" y="772" fill="#1B3A6B">F1</text>
    <rect x="760" y="690" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="910" y="772" fill="#1B3A6B">90</text>
    <rect x="1060" y="690" width="860" height="130" fill="none" stroke="#B3541E" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="1490" y="772" fill="#B3541E">dataRecord ×17</text>
  </g>
  <g font-size="30" fill="#3D4A5C" text-anchor="middle">
    <line x1="310" y1="820" x2="310" y2="870" stroke="#8A94A6" stroke-width="2"/>
    <text x="310" y="908">正应答 SID</text>
    <line x1="610" y1="820" x2="610" y2="870" stroke="#8A94A6" stroke-width="2"/>
    <line x1="910" y1="820" x2="910" y2="870" stroke="#8A94A6" stroke-width="2"/>
    <text x="760" y="908">DID 回显</text>
    <line x1="1490" y1="820" x2="1490" y2="870" stroke="#8A94A6" stroke-width="2"/>
    <text x="1490" y="908">17 字节 ASCII ＝ VIN（F190 定义）</text>
  </g>

  <!-- ③ 负应答 -->
  <text x="120" y="1060" fill="#1B3A6B" font-size="40" font-weight="700">Figure 3　负应答：固定三字节</text>
  <g font-size="46" font-weight="700" text-anchor="middle">
    <rect x="160" y="1100" width="300" height="130" fill="#B3541E"/>
    <text x="310" y="1182" fill="#F7F5F0">7F</text>
    <rect x="460" y="1100" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="610" y="1182" fill="#1B3A6B">22</text>
    <rect x="760" y="1100" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="910" y="1182" fill="#1B3A6B">31</text>
    <text x="1120" y="1182" fill="#3D4A5C" font-size="34" font-weight="400">"0x22 的请求被拒：NRC 0x31 参数越界"</text>
  </g>
  <g font-size="30" fill="#3D4A5C" text-anchor="middle">
    <line x1="310" y1="1230" x2="310" y2="1280" stroke="#8A94A6" stroke-width="2"/>
    <text x="310" y="1316">负应答 SID</text>
    <line x1="610" y1="1230" x2="610" y2="1280" stroke="#8A94A6" stroke-width="2"/>
    <text x="610" y="1316">请求 SID 回显</text>
    <line x1="910" y1="1230" x2="910" y2="1280" stroke="#8A94A6" stroke-width="2"/>
    <text x="910" y="1316">NRC 拒绝理由</text>
  </g>
</svg>
