<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <!-- 风格 A：工程蓝图 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 入门 · ②</text>
  <text x="160" y="330" fill="#F4F9FE" font-size="96" font-weight="800">ECU 的三重人格</text>
  <text x="160" y="430" fill="#9FC3E8" font-size="52">0x10 会话控制 · 从默认会话到编程会话</text>
  <line x1="160" y1="470" x2="1750" y2="470" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 三个房间平面图 -->
  <g font-size="34" text-anchor="middle">
    <!-- default -->
    <g transform="translate(560,1000)">
      <rect x="-280" y="-200" width="560" height="520" fill="#0B2440" stroke="#DCE9F5" stroke-width="3"/>
      <rect x="-280" y="-200" width="560" height="90" fill="#123A63"/>
      <text y="-140" fill="#F4F9FE" font-weight="700" font-size="40">0x01 默认会话</text>
      <text y="-60" fill="#9FC3E8">前台 · 上电默认</text>
      <text y="10" fill="#F4F9FE" font-size="28">读 VIN / 读版本</text>
      <text y="70" fill="#F4F9FE" font-size="28">读基本数据</text>
      <text y="180" fill="#7FB2E8" font-size="30">90% 危险操作被拦截</text>
    </g>
    <!-- extended -->
    <g transform="translate(1424,1000)">
      <rect x="-280" y="-200" width="560" height="520" fill="#0B2440" stroke="#E8A44C" stroke-width="3"/>
      <rect x="-280" y="-200" width="560" height="90" fill="#123A63"/>
      <text y="-140" fill="#F4F9FE" font-weight="700" font-size="40">0x03 扩展会话</text>
      <text y="-60" fill="#9FC3E8">维修间 · 10 03</text>
      <text y="10" fill="#F4F9FE" font-size="28">写数据 / IO 控制</text>
      <text y="70" fill="#F4F9FE" font-size="28">例程 / 读 DTC</text>
      <text y="180" fill="#E8A44C" font-size="30">多数写操作需 0x27 解锁</text>
    </g>
    <!-- programming -->
    <g transform="translate(2288,1000)">
      <rect x="-280" y="-200" width="560" height="520" fill="#0B2440" stroke="#DCE9F5" stroke-width="3"/>
      <rect x="-280" y="-200" width="560" height="90" fill="#123A63"/>
      <text y="-140" fill="#F4F9FE" font-weight="700" font-size="40">0x02 编程会话</text>
      <text y="-60" fill="#9FC3E8">刷写间 · 10 02</text>
      <text y="10" fill="#F4F9FE" font-size="28">34/36/37 传输</text>
      <text y="70" fill="#F4F9FE" font-size="28">擦除 / 校验例程</text>
      <text y="180" fill="#7FB2E8" font-size="30">跑在 Bootloader 里</text>
    </g>
  </g>

  <!-- 切换箭头 -->
  <g stroke="#7FB2E8" stroke-width="3" fill="#7FB2E8">
    <path d="M860,860 L1100,860" fill="none"/>
    <path d="M1100,860 L1060,842 L1060,878 Z"/>
    <path d="M1724,860 L1964,860" fill="none"/>
    <path d="M1964,860 L1924,842 L1924,878 Z"/>
    <text x="980" y="830" font-size="28" fill="#7FB2E8" text-anchor="middle" stroke="none">升级动作</text>
    <text x="1844" y="830" font-size="28" fill="#7FB2E8" text-anchor="middle" stroke="none">升级动作</text>
  </g>
  <!-- S3 回退虚线 -->
  <path d="M2288,1350 L560,1350" stroke="#E8A44C" stroke-width="3" stroke-dasharray="18 12" fill="none"/>
  <path d="M560,1350 L610,1328 L610,1372 Z" fill="#E8A44C"/>
  <text x="1424" y="1410" fill="#E8A44C" font-size="30" text-anchor="middle">S3 超时无心跳 → 自动打回默认会话</text>

  <!-- 报文样例 -->
  <g font-family="'SF Mono','Menlo',monospace">
    <text x="2240" y="300" fill="#F4F9FE" font-size="44">→ 10 03</text>
    <text x="2240" y="366" fill="#9FC3E8" font-size="44">← 50 03 00 32 01 F4</text>
  </g>
  <text x="160" y="1500" fill="#6E96C2" font-size="28">ISO 14229-1:2020 §10.2 · Table 25</text>
</svg>
