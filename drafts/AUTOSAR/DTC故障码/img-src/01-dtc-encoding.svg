<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'Songti SC','Noto Serif SC','PingFang SC',serif">
  <!-- C 技术手册：DTC 三字节编码 -->
  <rect width="2400" height="1350" fill="#F7F5F0"/>
  <line x1="120" y1="130" x2="2280" y2="130" stroke="#1B3A6B" stroke-width="5"/>
  <line x1="120" y1="144" x2="2280" y2="144" stroke="#1B3A6B" stroke-width="2"/>
  <text x="120" y="106" fill="#1B3A6B" font-size="36" font-weight="700" letter-spacing="4">DTC 的三字节编码</text>
  <text x="2280" y="106" fill="#B3541E" font-size="36" text-anchor="end">ISO 14229-1 §12.3 · Table 346 / SAE J2012</text>

  <text x="120" y="270" fill="#1B3A6B" font-size="40" font-weight="700">Figure 1　仪表上的 P0A9B-17，在总线上是三个字节</text>
  <g font-size="52" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo',monospace">
    <rect x="420" y="320" width="440" height="160" fill="#1B3A6B"/>
    <text x="640" y="422" fill="#F7F5F0">0A</text>
    <rect x="980" y="320" width="440" height="160" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="1200" y="422" fill="#1B3A6B">9B</text>
    <rect x="1540" y="320" width="440" height="160" fill="none" stroke="#B3541E" stroke-width="4"/>
    <text x="1760" y="422" fill="#B3541E">17</text>
  </g>
  <g font-size="30" fill="#3D4A5C" text-anchor="middle">
    <line x1="640" y1="480" x2="640" y2="530" stroke="#8A94A6" stroke-width="2"/>
    <text x="640" y="570">高字节：类别位</text>
    <text x="640" y="612">P＝动力系 / B＝车身 / C＝底盘 / U＝网络</text>
    <line x1="1200" y1="480" x2="1200" y2="530" stroke="#8A94A6" stroke-width="2"/>
    <text x="1200" y="570">中字节：具体故障号</text>
    <line x1="1760" y1="480" x2="1760" y2="530" stroke="#8A94A6" stroke-width="2"/>
    <text x="1760" y="570">低字节：故障子码</text>
    <text x="1760" y="612">（17 = 信号异常之类，SAE J2012 定义）</text>
  </g>

  <text x="120" y="790" fill="#1B3A6B" font-size="40" font-weight="700">Figure 2　0x19 0x02 的应答：每条记录 = DTC 3 字节 + 状态 1 字节</text>
  <g font-size="46" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo',monospace">
    <rect x="160" y="840" width="300" height="130" fill="#1B3A6B"/>
    <text x="310" y="922" fill="#F7F5F0">59</text>
    <rect x="460" y="840" width="300" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="610" y="922" fill="#1B3A6B">02</text>
    <rect x="760" y="840" width="300" height="130" fill="none" stroke="#B3541E" stroke-width="4"/>
    <text x="910" y="922" fill="#B3541E">7F</text>
    <rect x="1060" y="840" width="900" height="130" fill="none" stroke="#1B3A6B" stroke-width="4"/>
    <text x="1510" y="922" fill="#1B3A6B">0A 9B 17 | 2F</text>
  </g>
  <g font-size="30" fill="#3D4A5C" text-anchor="middle">
    <text x="310" y="1048">SID+0x40</text>
    <text x="610" y="1048">子功能回显</text>
    <text x="910" y="1048">状态可用掩码</text>
    <text x="1510" y="1048">DTC 三字节 + 状态字节，可重复多组</text>
  </g>

  <text x="120" y="1180" fill="#B3541E" font-size="32">掩码筛选是按位与、非零即中：(status &amp; mask) ≠ 0 —— 只看实锤故障就传 mask=0x08（§12.3.1.3）</text>
  <text x="120" y="1250" fill="#3D4A5C" font-size="32">五万种故障装进三个字节,且全行业统一——通用诊断仪和车厂专用工具读出同一个码</text>
</svg>
