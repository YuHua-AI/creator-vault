<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1600" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <!-- 风格 A：RID 工单 -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2848" height="1600" fill="#0E2A47"/>
  <rect width="2848" height="1600" fill="url(#grid)"/>
  <rect x="48" y="48" width="2752" height="1504" fill="none" stroke="#DCE9F5" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="72" width="2704" height="1456" fill="none" stroke="#DCE9F5" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="160" y="220" fill="#9FC3E8" font-size="40" letter-spacing="10">AUTOSAR 入门 · ⑤</text>
  <text x="160" y="330" fill="#F4F9FE" font-size="96" font-weight="800">让 ECU 按指令干活</text>
  <text x="160" y="430" fill="#9FC3E8" font-size="52">0x31 例程控制 · RID 工单</text>
  <line x1="160" y1="470" x2="1750" y2="470" stroke="#DCE9F5" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 工单卡片 -->
  <g font-family="'SF Mono','Menlo',monospace" text-anchor="middle">
    <g transform="translate(700,900)">
      <rect x="-300" y="-160" width="600" height="420" rx="18" fill="#0B2440" stroke="#7FB2E8" stroke-width="3"/>
      <rect x="-300" y="-160" width="600" height="90" fill="#123A63"/>
      <text y="-98" fill="#7FB2E8" font-size="40" font-weight="700">31 01 · 派活</text>
      <text y="20" fill="#F4F9FE" font-size="34">startRoutine</text>
      <text y="110" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">风扇自检 · 擦 Flash</text>
      <text y="180" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">怠速学习 · 线束自检</text>
    </g>
    <g transform="translate(1424,900)">
      <rect x="-300" y="-160" width="600" height="420" rx="18" fill="#0B2440" stroke="#DCE9F5" stroke-width="3"/>
      <rect x="-300" y="-160" width="600" height="90" fill="#123A63"/>
      <text y="-98" fill="#DCE9F5" font-size="40" font-weight="700">31 02 · 撤活</text>
      <text y="20" fill="#F4F9FE" font-size="34">stopRoutine</text>
      <text y="110" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">标准留了自由度:</text>
      <text y="180" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">方法A 客户端停 / 方法B 自动停</text>
    </g>
    <g transform="translate(2148,900)">
      <rect x="-300" y="-160" width="600" height="420" rx="18" fill="#0B2440" stroke="#E8A44C" stroke-width="3"/>
      <rect x="-300" y="-160" width="600" height="90" fill="#123A63"/>
      <text y="-98" fill="#E8A44C" font-size="40" font-weight="700">31 03 · 要结果</text>
      <text y="20" fill="#F4F9FE" font-size="34">requestResults</text>
      <text y="110" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">哪根线闪断 · 自检结论</text>
      <text y="180" fill="#9FC3E8" font-size="28" font-family="'PingFang SC',sans-serif">退出状态 + 采集数据</text>
    </g>
  </g>

  <!-- 尺寸标注 -->
  <g stroke="#7FB2E8" stroke-width="2">
    <line x1="400" y1="1210" x2="2448" y2="1210"/>
    <line x1="400" y1="1190" x2="400" y2="1230"/>
    <line x1="2448" y1="1190" x2="2448" y2="1230"/>
    <text x="1424" y="1280" fill="#7FB2E8" font-size="30" text-anchor="middle" stroke="none">DID 是门牌号（数据）· RID 是工单号（动作）</text>
  </g>

  <g font-family="'SF Mono','Menlo',monospace">
    <text x="2240" y="300" fill="#F4F9FE" font-size="44">→ 31 01 02 01</text>
    <text x="2240" y="366" fill="#9FC3E8" font-size="44">← 71 01 02 01 32</text>
  </g>
  <text x="160" y="1500" fill="#6E96C2" font-size="28">ISO 14229-1:2020 §14.2 · Table 425</text>
</svg>
