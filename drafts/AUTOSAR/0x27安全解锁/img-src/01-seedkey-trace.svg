<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'SF Mono','Menlo','Courier New',monospace">
  <!-- B 终端抓包：一次完整解锁 -->
  <rect width="2400" height="1350" fill="#0D1117"/>
  <defs>
    <pattern id="g2" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#3FB950" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="url(#g2)"/>
  <text x="100" y="120" fill="#3FB950" font-size="34" font-family="'PingFang SC',sans-serif">$ candump -tz can0,7E0:7E8   <tspan fill="#6E7781"># 一次真实的安全解锁</tspan></text>

  <rect x="100" y="170" width="2200" height="980" rx="24" fill="#090C10" stroke="#30363D" stroke-width="3"/>
  <rect x="100" y="170" width="2200" height="80" rx="24" fill="#161B22"/>
  <circle cx="172" cy="210" r="14" fill="#DD4B4B"/><circle cx="224" cy="210" r="14" fill="#D29922"/><circle cx="276" cy="210" r="14" fill="#3FB950"/>

  <g font-size="42">
    <text x="180" y="350" fill="#8B949E">(0000.000)  can0  TX  <tspan fill="#79C0FF">7E0</tspan>  [2]  <tspan fill="#3FB950">27 01</tspan>           <tspan fill="#6E7781"># 要 seed (等级1,奇数)</tspan></text>
    <text x="180" y="450" fill="#8B949E">(0000.008)  can0  RX  <tspan fill="#79C0FF">7E8</tspan>  [6]  <tspan fill="#3FB950">67 01</tspan> 4A 7B 22 91  <tspan fill="#6E7781"># seed=非零→还锁着</tspan></text>
    <text x="180" y="550" fill="#6E7781">            <tspan fill="#D29922">(诊断仪本地跑 Seed→Key 算法,总线上无痕迹)</tspan></text>
    <text x="180" y="670" fill="#8B949E">(0000.960)  can0  TX  <tspan fill="#79C0FF">7E0</tspan>  [6]  <tspan fill="#3FB950">27 02</tspan> 33 8C AA 10  <tspan fill="#6E7781"># 交 key (=seed+1,偶数)</tspan></text>
    <text x="180" y="770" fill="#8B949E">(0000.968)  can0  RX  <tspan fill="#79C0FF">7E8</tspan>  [2]  <tspan fill="#3FB950">67 02</tspan>           <tspan fill="#6E7781"># 咔哒,开了</tspan></text>
  </g>

  <!-- 错误分支 -->
  <g font-size="42">
    <text x="180" y="930" fill="#6E7781"># 换个错误剧本——</text>
    <text x="180" y="1000" fill="#8B949E">(0002.000)  can0  TX  <tspan fill="#79C0FF">7E0</tspan>  [6]  27 02 00 00 00 00  <tspan fill="#6E7781"># 错 key</tspan></text>
    <text x="180" y="1070" fill="#8B949E">(0002.008)  can0  RX  <tspan fill="#79C0FF">7E8</tspan>  [3]  <tspan fill="#DD4B4B">7F 27 35</tspan>        <tspan fill="#6E7781"># InvalidKey</tspan></text>
  </g>
  <text x="100" y="1250" fill="#6E7781" font-size="30" font-family="'PingFang SC',sans-serif">抓遍总线也凑不出算法——这就是挑战-应答的安全底座</text>
</svg>
