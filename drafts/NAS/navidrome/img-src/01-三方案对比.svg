<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.28" r="1">
      <stop offset="0" stop-color="#16294A"/><stop offset="1" stop-color="#0A1826"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#35D0FF"/>
    </filter>
    <filter id="glowG" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3EE8B0"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#bgGlow)"/>
  <rect width="2400" height="1350" fill="url(#grid)" opacity="0.35"/>

  <!-- 粒子 -->
  <circle cx="260" cy="240" r="3" fill="#7FA8D0" opacity="0.35"/>
  <circle cx="2200" cy="300" r="3" fill="#7FA8D0" opacity="0.4"/>
  <circle cx="500" cy="1150" r="2" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1900" cy="1120" r="2" fill="#7FA8D0" opacity="0.3"/>

  <!-- 顶部胶囊 -->
  <rect x="880" y="80" width="640" height="60" rx="30" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="1200" y="120" text-anchor="middle" font-size="29" fill="#D6E6F5" letter-spacing="5">WHY · 为什么是 Navidrome</text>

  <!-- ===== 卡一：Jellyfin（塞满的全家桶） ===== -->
  <g>
    <rect x="200" y="330" width="560" height="520" rx="20" fill="#12294D" stroke="#3B9FE8" stroke-width="4"/>
    <!-- 塞满的格子：电影/剧集/音乐 什么都装 -->
    <g stroke="#3B9FE8" stroke-width="2.5" fill="none" opacity="0.55">
      <rect x="248" y="384" width="120" height="90" rx="8"/><rect x="392" y="384" width="120" height="90" rx="8"/><rect x="536" y="384" width="120" height="90" rx="8"/>
      <rect x="248" y="500" width="120" height="90" rx="8"/><rect x="392" y="500" width="120" height="90" rx="8"/><rect x="536" y="500" width="120" height="90" rx="8"/>
      <rect x="248" y="616" width="120" height="90" rx="8"/><rect x="392" y="616" width="120" height="90" rx="8"/><rect x="536" y="616" width="120" height="90" rx="8"/>
    </g>
    <!-- 格内图标意象：胶片/屏幕/音符 -->
    <g fill="#3B9FE8" opacity="0.8">
      <circle cx="308" cy="429" r="12"/><circle cx="452" cy="429" r="12"/><circle cx="596" cy="429" r="12"/>
      <rect x="290" y="538" width="36" height="14" rx="4"/><rect x="434" y="538" width="36" height="14" rx="4"/><rect x="578" y="538" width="36" height="14" rx="4"/>
      <rect x="290" y="654" width="36" height="14" rx="4"/><rect x="434" y="654" width="36" height="14" rx="4"/><rect x="578" y="654" width="36" height="14" rx="4"/>
    </g>
    <!-- 重量条：越满越重 -->
    <g>
      <rect x="248" y="766" width="408" height="14" rx="7" fill="#16293E"/>
      <rect x="248" y="766" width="340" height="14" rx="7" fill="#3B9FE8" opacity="0.85"/>
      <text x="676" y="780" font-size="26" fill="#8FAECB">重</text>
    </g>
    <text x="480" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#E8F0F8">Jellyfin</text>
    <text x="480" y="990" text-anchor="middle" font-size="28" fill="#6B8299">全家桶 · 音乐只是其中一格</text>
  </g>

  <!-- ===== 卡二：Plex（订阅墙） ===== -->
  <g>
    <rect x="920" y="330" width="560" height="520" rx="20" fill="#12294D" stroke="#3B9FE8" stroke-width="4"/>
    <!-- 媒体库 -->
    <g stroke="#3B9FE8" stroke-width="2.5" fill="none" opacity="0.55">
      <rect x="968" y="384" width="220" height="150" rx="8"/><rect x="1212" y="384" width="220" height="150" rx="8"/>
      <rect x="968" y="560" width="220" height="150" rx="8"/><rect x="1212" y="560" width="220" height="150" rx="8"/>
    </g>
    <!-- 音乐格上的小锁：完整体验要订阅 -->
    <g stroke="#3B9FE8" stroke-width="3" fill="none">
      <rect x="1176" y="424" width="52" height="42" rx="8"/>
      <path d="M 1186 424 V 404 A 16 16 0 0 1 1218 404 V 424"/>
    </g>
    <!-- 重量条 -->
    <g>
      <rect x="968" y="766" width="408" height="14" rx="7" fill="#16293E"/>
      <rect x="968" y="766" width="320" height="14" rx="7" fill="#3B9FE8" opacity="0.85"/>
      <text x="1396" y="780" font-size="26" fill="#8FAECB">重</text>
    </g>
    <text x="1200" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#E8F0F8">Plex</text>
    <text x="1200" y="990" text-anchor="middle" font-size="28" fill="#6B8299">订阅制 · 音乐体验锁着卖</text>
  </g>

  <!-- ===== 卡三：Navidrome（主角，留白+发光） ===== -->
  <g>
    <rect x="1640" y="300" width="560" height="580" rx="20" fill="#12294D" stroke="#35D0FF" stroke-width="5" filter="url(#glow)"/>
    <!-- 留白中央：大音符 + 波形 -->
    <text x="1908" y="580" text-anchor="middle" font-size="150" fill="#3EE8B0" filter="url(#glowG)">♪</text>
    <path d="M 1730 660 C 1790 620 1830 700 1890 660 C 1950 620 1990 700 2110 650"
          fill="none" stroke="#35D0FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- 状态灯 -->
    <circle cx="1690" cy="352" r="10" fill="#3EE8B0" filter="url(#glowG)"/>
    <!-- 重量条：几乎空 -->
    <g>
      <rect x="1688" y="806" width="408" height="14" rx="7" fill="#16293E"/>
      <rect x="1688" y="806" width="56" height="14" rx="7" fill="#3EE8B0" filter="url(#glowG)"/>
      <text x="2116" y="820" font-size="26" fill="#3EE8B0" filter="url(#glowG)">极轻</text>
    </g>
    <text x="1920" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#3EE8B0" filter="url(#glowG)">Navidrome</text>
    <text x="1920" y="990" text-anchor="middle" font-size="28" fill="#8FAECB">纯音乐 · ARM 常开 · Subsonic 生态</text>
  </g>

  <!-- 底部金句 -->
  <text x="1200" y="1210" text-anchor="middle" font-size="46" font-weight="700" fill="#E8F0F8">弱硬件上，<tspan fill="#3EE8B0" filter="url(#glowG)">轻就是全能</tspan></text>
</svg>
