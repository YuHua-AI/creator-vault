<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.5"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.45"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="float" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <ellipse cx="500" cy="250" rx="700" ry="500" fill="url(#glowA)"/>
  <ellipse cx="2000" cy="1150" rx="750" ry="520" fill="url(#glowB)"/>
  <circle cx="220" cy="1100" r="5" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="2200" cy="220" r="5" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="1900" cy="130" r="3" fill="#FFFFFF" opacity="0.35"/>

  <!-- 顶部玻璃胶囊 -->
  <g>
    <rect x="880" y="80" width="640" height="62" rx="31" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <text x="1200" y="121" text-anchor="middle" font-size="29" fill="#FFFFFF" letter-spacing="5">WHY · 为什么是 Navidrome</text>
  </g>

  <!-- ===== 卡一：Jellyfin ===== -->
  <g filter="url(#float)">
    <rect x="200" y="330" width="560" height="520" rx="28" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.5">
    <rect x="248" y="384" width="120" height="90" rx="10"/><rect x="392" y="384" width="120" height="90" rx="10"/><rect x="536" y="384" width="120" height="90" rx="10"/>
    <rect x="248" y="500" width="120" height="90" rx="10"/><rect x="392" y="500" width="120" height="90" rx="10"/><rect x="536" y="500" width="120" height="90" rx="10"/>
    <rect x="248" y="616" width="120" height="90" rx="10"/><rect x="392" y="616" width="120" height="90" rx="10"/><rect x="536" y="616" width="120" height="90" rx="10"/>
  </g>
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="308" cy="429" r="12"/><circle cx="452" cy="429" r="12"/><circle cx="596" cy="429" r="12"/>
    <rect x="290" y="538" width="36" height="14" rx="4"/><rect x="434" y="538" width="36" height="14" rx="4"/><rect x="578" y="538" width="36" height="14" rx="4"/>
    <rect x="290" y="654" width="36" height="14" rx="4"/><rect x="434" y="654" width="36" height="14" rx="4"/><rect x="578" y="654" width="36" height="14" rx="4"/>
  </g>
  <g>
    <rect x="248" y="766" width="408" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="248" y="766" width="340" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <text x="676" y="780" font-size="26" fill="#E0F2FE">重</text>
  </g>
  <text x="480" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#FFFFFF">Jellyfin</text>
  <text x="480" y="990" text-anchor="middle" font-size="28" fill="#C7D8F5">全家桶 · 音乐只是其中一格</text>

  <!-- ===== 卡二：Plex ===== -->
  <g filter="url(#float)">
    <rect x="920" y="330" width="560" height="520" rx="28" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.5">
    <rect x="968" y="384" width="220" height="150" rx="12"/><rect x="1212" y="384" width="220" height="150" rx="12"/>
    <rect x="968" y="560" width="220" height="150" rx="12"/><rect x="1212" y="560" width="220" height="150" rx="12"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.85">
    <rect x="1176" y="424" width="52" height="42" rx="8"/>
    <path d="M 1186 424 V 404 A 16 16 0 0 1 1218 404 V 424"/>
  </g>
  <g>
    <rect x="968" y="766" width="408" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="968" y="766" width="320" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <text x="1396" y="780" font-size="26" fill="#E0F2FE">重</text>
  </g>
  <text x="1200" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#FFFFFF">Plex</text>
  <text x="1200" y="990" text-anchor="middle" font-size="28" fill="#C7D8F5">订阅制 · 音乐体验锁着卖</text>

  <!-- ===== 卡三：Navidrome（主角高亮） ===== -->
  <g filter="url(#float)">
    <rect x="1640" y="300" width="560" height="580" rx="28" fill="#FFFFFF" fill-opacity="0.2" stroke="#67E8F9" stroke-opacity="0.95" stroke-width="4"/>
  </g>
  <text x="1908" y="580" text-anchor="middle" font-size="150" fill="#FFFFFF">♪</text>
  <path d="M 1730 660 C 1790 620 1830 700 1890 660 C 1950 620 1990 700 2110 650"
        fill="none" stroke="#67E8F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1690" cy="352" r="10" fill="#67E8F9"/>
  <g>
    <rect x="1688" y="806" width="408" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="1688" y="806" width="56" height="14" rx="7" fill="#67E8F9"/>
    <text x="2116" y="820" font-size="26" fill="#67E8F9">极轻</text>
  </g>
  <text x="1920" y="940" text-anchor="middle" font-size="38" font-weight="700" fill="#67E8F9">Navidrome</text>
  <text x="1920" y="990" text-anchor="middle" font-size="28" fill="#E0F2FE">纯音乐 · ARM 常开 · Subsonic 生态</text>

  <!-- 底部金句 -->
  <text x="1200" y="1210" text-anchor="middle" font-size="46" font-weight="700" fill="#FFFFFF">弱硬件上，<tspan fill="#67E8F9">轻就是全能</tspan></text>
</svg>
