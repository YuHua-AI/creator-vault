<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16294A"/><stop offset="100%" stop-color="#0A1826"/>
    </radialGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3EE8B0"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#132440" stroke-opacity="0.35" stroke-width="1.5"/>
    </pattern>
    <g id="ic-player" fill="none" stroke="#35D0FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-50" y="-34" width="100" height="68" rx="8" fill="#12294D"/>
      <line x1="-50" y1="-16" x2="50" y2="-16"/>
      <circle cx="-39" cy="-25" r="2.5" fill="#35D0FF" stroke="none"/><circle cx="-30" cy="-25" r="2.5" fill="#35D0FF" stroke="none"/><circle cx="-21" cy="-25" r="2.5" fill="#3EE8B0" stroke="none"/>
      <path d="M-14 -6 L10 4 L-14 14 Z" fill="#3EE8B0" stroke="none"/>
      <line x1="22" y1="-2" x2="42" y2="-2"/><line x1="22" y1="10" x2="34" y2="10"/>
      <line x1="-38" y1="24" x2="42" y2="24"/><circle cx="-12" cy="24" r="4.5" fill="#3EE8B0" stroke="none"/></g>
  </defs>

  <rect width="1350" height="1800" fill="url(#bgGlow)"/>
  <rect width="1350" height="1800" fill="url(#grid)"/>
  <ellipse cx="240" cy="1600" rx="480" ry="300" fill="#14405E" opacity="0.28"/>
  <circle cx="1200" cy="180" r="3" fill="#7FA8D0" opacity="0.45"/>
  <circle cx="130" cy="760" r="2.5" fill="#7FA8D0" opacity="0.3"/>
  <circle cx="1240" cy="980" r="2.5" fill="#7FA8D0" opacity="0.35"/>

  <!-- 顶部胶囊 -->
  <rect x="64" y="56" width="470" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
  <text x="299" y="92" text-anchor="middle" font-size="26" letter-spacing="5" fill="#D6E6F5">GITHUB WEEKLY · 开源周榜</text>
  <text x="64" y="146" font-size="20" letter-spacing="2" fill="#4E6A85">统计周期 2026.11.10 – 11.15</text>
  <rect x="1074" y="56" width="212" height="54" rx="27" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.8"/>
  <text x="1180" y="93" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3" fill="#7FA8D0">NO.08</text>

  <!-- 专属图标 -->
  <use href="#ic-player" transform="translate(675 305) scale(1.6)"/>

  <!-- 项目名标题 + 作者·语言小字 -->
  <text x="675" y="505" text-anchor="middle" font-size="72" font-weight="800" fill="#FFFFFF">HGhub</text>
  <text x="675" y="562" text-anchor="middle" font-size="26" letter-spacing="1" fill="#8FAECB">Minireel · Rust</text>

  <!-- 一句话介绍 -->
  <text x="675" y="655" text-anchor="middle" font-size="46" font-weight="700" fill="#3EE8B0" filter="url(#glowGreen)">内容源自己接的播放器</text>

  <!-- 星数 -->
  <rect x="65" y="706" width="560" height="140" rx="18" fill="#0E2038" fill-opacity="0.9" stroke="#29527A" stroke-width="1.5"/>
  <text x="345" y="748" text-anchor="middle" font-size="20" letter-spacing="6" fill="#6B8299">总星标 TOTAL</text>
  <text x="345" y="816" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF"><tspan fill="#35D0FF">★</tspan> 8.8k</text>
  <rect x="725" y="706" width="560" height="140" rx="18" fill="#0E2038" fill-opacity="0.9" stroke="#3EE8B0" stroke-opacity="0.55" stroke-width="1.8"/>
  <text x="1005" y="748" text-anchor="middle" font-size="20" letter-spacing="6" fill="#6B8299">本周增长 WEEKLY</text>
  <text x="1005" y="816" text-anchor="middle" font-size="56" font-weight="800" fill="#3EE8B0" filter="url(#glowGreen)">▲ 6,593</text>

  <!-- 分隔线 -->
  <line x1="220" y1="880" x2="1130" y2="880" stroke="#29527A" stroke-width="2"/>
  <circle cx="675" cy="880" r="6" fill="#0A1826" stroke="#35D0FF" stroke-width="2.5"/>

  <!-- 正文三段 -->
  <rect x="110" y="952" width="140" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="180" y="981" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">项目速览</text>
    <text x="110" y="1044" font-size="27" fill="#B8CCDF">Tauri 2 + React 的聚合播放器：浏览、搜索、播放、</text>
  <text x="110" y="1090" font-size="27" fill="#B8CCDF">片库一体，内容源靠 JavaScript 插件自行接入。</text>
  <rect x="110" y="1168" width="140" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="180" y="1197" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">核心玩法</text>
    <text x="110" y="1260" font-size="27" fill="#B8CCDF">多来源聚合搜索、切线路与清晰度、追更续播；插件</text>
  <text x="110" y="1306" font-size="27" fill="#B8CCDF">协议开源，文档还教你怎么让 Agent 帮你写插件。</text>
  <rect x="110" y="1384" width="140" height="42" rx="21" fill="none" stroke="#3EE8B0" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="180" y="1413" text-anchor="middle" font-size="24" letter-spacing="4" fill="#3EE8B0">适用人群</text>
    <text x="110" y="1476" font-size="27" fill="#B8CCDF">会自己动手配置、想要统一观影界面的自托管玩家，</text>
  <text x="110" y="1522" font-size="27" fill="#B8CCDF">和想练插件接口设计的开发者。</text>

  <!-- 标签 -->
  <rect x="423.1" y="1564" width="188.6" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="517.4" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">视频播放器</text><rect x="633.7" y="1564" width="135.6" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="701.5" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">插件化</text><rect x="791.3" y="1564" width="135.6" height="52" rx="26" fill="#0E2A4A" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="859.1" y="1600" text-anchor="middle" font-size="26" fill="#D6E6F5">自托管</text>

  <!-- 底部 -->
  <line x1="64" y1="1664" x2="1286" y2="1664" stroke="#1E3A56" stroke-width="2"/>
  <text x="64" y="1722" font-size="26" letter-spacing="3" fill="#8FAECB">屿华AI · YuHua-AIPlay</text>
  <text x="1286" y="1722" text-anchor="end" font-size="24" fill="#4E6A85">github.com/Minireel/HGhub</text>
</svg>
