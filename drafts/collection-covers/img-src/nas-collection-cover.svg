<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <!-- 暖色家居风：NAS 折腾记合集封面（竖图 3:4，数据枢纽主题） -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2620"/>
      <stop offset="1" stop-color="#1F1B16"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1440" fill="url(#warm)"/>
  <rect x="36" y="36" width="1008" height="1368" fill="none" stroke="#C8A87C" stroke-opacity="0.5" stroke-width="3"/>

  <text x="90" y="210" fill="#C8A87C" font-size="34" letter-spacing="8">家庭数据中心 · 折腾实录</text>
  <line x1="90" y1="240" x2="560" y2="240" stroke="#C8A87C" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="380" fill="#F5EDE0" font-size="110" font-weight="800">NAS</text>
  <text x="90" y="500" fill="#F5EDE0" font-size="110" font-weight="800">折腾记</text>
  <text x="90" y="580" fill="#C8A87C" font-size="38">家里所有数据的十字路口</text>

  <!-- 中央 NAS 枢纽 -->
  <g>
    <rect x="410" y="620" width="280" height="340" rx="14" fill="#C8A87C" fill-opacity="0.08"/>
    <rect x="400" y="606" width="280" height="340" rx="14" fill="#171310" stroke="#C8A87C" stroke-width="3.5"/>
    <g fill="none" stroke="#C8A87C" stroke-width="2.5">
      <rect x="432" y="640" width="216" height="50" rx="5"/>
      <rect x="432" y="706" width="216" height="50" rx="5"/>
      <rect x="432" y="772" width="216" height="50" rx="5"/>
    </g>
    <g stroke="#C8A87C" stroke-width="2.5">
      <line x1="600" y1="665" x2="630" y2="665"/>
      <line x1="600" y1="731" x2="630" y2="731"/>
      <line x1="600" y1="797" x2="630" y2="797"/>
    </g>
    <g fill="#7FB2E8">
      <circle cx="454" cy="665" r="7"/>
      <circle cx="454" cy="731" r="7" fill-opacity="0.55"/>
      <circle cx="454" cy="797" r="7" fill-opacity="0.25"/>
    </g>
    <circle cx="644" cy="906" r="10" fill="none" stroke="#C8A87C" stroke-width="3"/>
    <line x1="644" y1="899" x2="644" y2="910" stroke="#C8A87C" stroke-width="3"/>
    <text x="540" y="992" fill="#C8A87C" font-size="32" text-anchor="middle" font-weight="700">NAS · 数据枢纽</text>
  </g>

  <!-- 左侧流入箭头（蓝） -->
  <g stroke="#7FB2E8" stroke-width="3.5" fill="#7FB2E8" stroke-linecap="round">
    <line x1="300" y1="690" x2="382" y2="690"/><path d="M396,690 L378,680 L378,700 Z" stroke="none"/>
    <line x1="300" y1="790" x2="382" y2="790"/><path d="M396,790 L378,780 L378,800 Z" stroke="none"/>
    <line x1="300" y1="890" x2="382" y2="890"/><path d="M396,890 L378,880 L378,900 Z" stroke="none"/>
  </g>
  <g fill="#7FB2E8">
    <rect x="318" y="683" width="14" height="14" rx="3"/>
    <rect x="348" y="783" width="14" height="14" rx="3" fill-opacity="0.6"/>
    <rect x="326" y="883" width="14" height="14" rx="3" fill-opacity="0.35"/>
  </g>

  <!-- R1 照片 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3">
    <rect x="150" y="632" width="150" height="116" rx="8"/>
  </g>
  <g fill="none" stroke="#C8A87C" stroke-width="2.5">
    <circle cx="200" cy="672" r="13"/>
    <path d="M162,734 L212,692 L242,722 L264,704 L288,724 L288,736 L162,736 Z"/>
  </g>
  <text x="225" y="786" fill="#F5EDE0" font-size="28" text-anchor="middle">照片</text>

  <!-- R2 音乐 -->
  <g fill="none" stroke="#C8A87C" stroke-width="3">
    <circle cx="192" cy="806" r="16"/>
    <line x1="208" y1="798" x2="208" y2="740"/>
    <path d="M208,740 L258,758 L258,772"/>
    <circle cx="274" cy="774" r="12"/>
  </g>
  <text x="225" y="858" fill="#F5EDE0" font-size="28" text-anchor="middle">音乐</text>

  <!-- R3 备份云 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3">
    <path d="M168,946 a22,22 0 0 1 5,-44 a28,28 0 0 1 53,-6 a19,19 0 0 1 9,37 a15,15 0 0 1 -10,12 Z"/>
  </g>
  <path d="M214,950 L214,974 M214,974 L203,963 M214,974 L225,963" stroke="#7FB2E8" stroke-width="3" fill="none"/>
  <text x="225" y="1004" fill="#F5EDE0" font-size="28" text-anchor="middle">备份</text>

  <!-- 右侧流出箭头（金） -->
  <g stroke="#C8A87C" stroke-width="3.5" fill="#C8A87C" stroke-linecap="round">
    <line x1="698" y1="690" x2="780" y2="690"/><path d="M794,690 L776,680 L776,700 Z" stroke="none"/>
    <line x1="698" y1="790" x2="780" y2="790"/><path d="M794,790 L776,780 L776,800 Z" stroke="none"/>
    <line x1="698" y1="890" x2="780" y2="890"/><path d="M794,890 L776,880 L776,900 Z" stroke="none"/>
  </g>
  <g fill="#C8A87C">
    <rect x="758" y="683" width="14" height="14" rx="3"/>
    <rect x="730" y="783" width="14" height="14" rx="3" fill-opacity="0.6"/>
    <rect x="746" y="883" width="14" height="14" rx="3" fill-opacity="0.35"/>
  </g>

  <!-- R1 电视 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3">
    <rect x="812" y="636" width="156" height="96" rx="8"/>
    <line x1="890" y1="732" x2="890" y2="752"/>
    <line x1="856" y1="756" x2="924" y2="756"/>
  </g>
  <text x="890" y="800" fill="#F5EDE0" font-size="28" text-anchor="middle">电视</text>

  <!-- R2 手机 -->
  <g fill="none" stroke="#C8A87C" stroke-width="3">
    <rect x="848" y="726" width="84" height="136" rx="14"/>
    <line x1="874" y1="840" x2="906" y2="840"/>
  </g>
  <text x="890" y="890" fill="#F5EDE0" font-size="28" text-anchor="middle">手机</text>

  <!-- R3 电脑 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3">
    <rect x="822" y="828" width="120" height="78" rx="6"/>
    <path d="M802,906 L962,906 L982,950 L782,950 Z"/>
  </g>
  <text x="890" y="992" fill="#F5EDE0" font-size="28" text-anchor="middle">电脑</text>

  <text x="90" y="1330" fill="#F5EDE0" font-size="42" font-weight="700">设备会吃灰，<tspan fill="#C8A87C">折腾不会</tspan></text>
</svg>
