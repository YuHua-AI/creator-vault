<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" font-family="'Songti SC','Noto Serif SC','PingFang SC',serif">
  <!-- C 手册风：NAS 折腾记合集封面（竖图 3:4，米白纸面线描版） -->
  <defs>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#1B3A6B" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1080" height="1440" fill="#F7F2EA"/>
  <rect width="1080" height="1440" fill="url(#dots)"/>
  <rect x="36" y="36" width="1008" height="1368" fill="none" stroke="#1B3A6B" stroke-width="4"/>
  <rect x="52" y="52" width="976" height="1336" fill="none" stroke="#1B3A6B" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- 顶部题头 -->
  <line x1="90" y1="130" x2="990" y2="130" stroke="#1B3A6B" stroke-width="5"/>
  <line x1="90" y1="144" x2="990" y2="144" stroke="#1B3A6B" stroke-width="2"/>
  <text x="90" y="106" fill="#1B3A6B" font-size="34" font-weight="700" letter-spacing="6">家庭数据中心 · 产品手册</text>
  <text x="990" y="106" fill="#B3541E" font-size="34" text-anchor="end" font-family="'SF Mono','Menlo',monospace">HOME SERVER</text>

  <text x="90" y="300" fill="#1B3A6B" font-size="120" font-weight="800">NAS</text>
  <text x="90" y="430" fill="#1B3A6B" font-size="120" font-weight="800">折腾记</text>
  <text x="90" y="510" fill="#B3541E" font-size="40">让数据住进自己家</text>

  <!-- 中央 NAS：产品手册式正视剖面 -->
  <g>
    <rect x="290" y="620" width="500" height="250" rx="14" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="4"/>
    <!-- 盘位 -->
    <g fill="none" stroke="#1B3A6B" stroke-width="2.5">
      <rect x="330" y="655" width="190" height="56" rx="5"/>
      <rect x="330" y="727" width="190" height="56" rx="5"/>
      <rect x="330" y="799" width="190" height="56" rx="5"/>
      <rect x="550" y="655" width="190" height="56" rx="5"/>
      <rect x="550" y="727" width="190" height="56" rx="5"/>
      <rect x="550" y="799" width="190" height="56" rx="5"/>
    </g>
    <!-- 硬盘拉手 -->
    <g stroke="#1B3A6B" stroke-width="2">
      <line x1="470" y1="683" x2="505" y2="683"/>
      <line x1="470" y1="755" x2="505" y2="755"/>
      <line x1="470" y1="827" x2="505" y2="827"/>
    </g>
    <!-- 呼吸灯 -->
    <circle cx="310" cy="683" r="8" fill="#B3541E"/>
    <circle cx="310" cy="755" r="8" fill="#B3541E" fill-opacity="0.55"/>
    <circle cx="310" cy="827" r="8" fill="#B3541E" fill-opacity="0.25"/>
    <text x="540" y="920" fill="#1B3A6B" font-size="32" text-anchor="middle" font-weight="700">存储池 · 数据的家</text>
  </g>

  <!-- 四端线描图标 + 虚线取数 -->
  <g stroke="#B3541E" stroke-width="3" fill="none" stroke-dasharray="10 8" stroke-linecap="round">
    <path d="M240,600 L360,650"/>
    <path d="M840,600 L720,650"/>
    <path d="M260,1030 L380,890"/>
    <path d="M820,1030 L700,890"/>
  </g>

  <!-- 手机 -->
  <g fill="none" stroke="#1B3A6B" stroke-width="3.5">
    <rect x="185" y="470" width="86" height="140" rx="14"/>
    <line x1="212" y1="586" x2="244" y2="586"/>
  </g>
  <text x="228" y="660" fill="#1B3A6B" font-size="28" text-anchor="middle">手机</text>

  <!-- 笔记本 -->
  <g fill="#FFFFFF" stroke="#1B3A6B" stroke-width="3.5">
    <rect x="790" y="470" width="120" height="80" rx="6"/>
    <path d="M770,550 L930,550 L950,596 L750,596 Z"/>
  </g>
  <text x="850" y="660" fill="#1B3A6B" font-size="28" text-anchor="middle">电脑</text>

  <!-- 电视 -->
  <g fill="#FFFFFF" stroke="#1B3A6B" stroke-width="3.5">
    <rect x="165" y="1040" width="170" height="104" rx="8"/>
    <line x1="250" y1="1144" x2="250" y2="1170"/>
    <line x1="210" y1="1174" x2="290" y2="1174"/>
  </g>
  <text x="250" y="1232" fill="#1B3A6B" font-size="28" text-anchor="middle">电视</text>

  <!-- 云 -->
  <g fill="#FFFFFF" stroke="#1B3A6B" stroke-width="3.5">
    <path d="M820,1080 a30,30 0 0 1 6,-59 a38,38 0 0 1 72,-8 a26,26 0 0 1 12,51 a20,20 0 0 1 -14,16 Z"/>
  </g>
  <path d="M865,1090 L865,1125 M865,1125 L852,1112 M865,1125 L878,1112" stroke="#B3541E" stroke-width="3.5" fill="none"/>
  <text x="865" y="1232" fill="#1B3A6B" font-size="28" text-anchor="middle">云端</text>

  <!-- 底部金句 + 规格行 -->
  <line x1="90" y1="1280" x2="990" y2="1280" stroke="#1B3A6B" stroke-width="2"/>
  <text x="90" y="1360" fill="#1B3A6B" font-size="44" font-weight="700">设备会吃灰，<tspan fill="#B3541E">折腾不会</tspan></text>
  <text x="990" y="1360" fill="#1B3A6B" fill-opacity="0.6" font-size="26" text-anchor="end" font-family="'SF Mono','Menlo',monospace">FIG. 03 · REV 2.0</text>
</svg>
