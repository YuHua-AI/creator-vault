<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" font-family="'Songti SC','Noto Serif SC','PingFang SC',serif">
  <!-- 深棕手册风：NAS 折腾记合集封面（竖图 3:4，四角对称版） -->
  <defs>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#C8A87C" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2620"/>
      <stop offset="1" stop-color="#1F1B16"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1440" fill="url(#warm)"/>
  <rect width="1080" height="1440" fill="url(#dots)"/>
  <rect x="36" y="36" width="1008" height="1368" fill="none" stroke="#C8A87C" stroke-width="4"/>
  <rect x="52" y="52" width="976" height="1336" fill="none" stroke="#C8A87C" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- 题头 -->
  <line x1="90" y1="130" x2="990" y2="130" stroke="#C8A87C" stroke-width="5"/>
  <line x1="90" y1="144" x2="990" y2="144" stroke="#C8A87C" stroke-width="2"/>
  <text x="90" y="106" fill="#C8A87C" font-size="34" font-weight="700" letter-spacing="6">家庭数据中心 · 产品手册</text>
  <text x="990" y="106" fill="#E8A44C" font-size="34" text-anchor="end" font-family="'SF Mono','Menlo',monospace">HOME SERVER</text>

  <text x="90" y="300" fill="#F5EDE0" font-size="120" font-weight="800">NAS</text>
  <text x="90" y="430" fill="#F5EDE0" font-size="120" font-weight="800">折腾记</text>
  <text x="90" y="510" fill="#E8A44C" font-size="40">让数据住进自己家</text>

  <!-- 中央 NAS（水平居中 x=540，垂直带 640~890） -->
  <g>
    <rect x="300" y="700" width="480" height="250" rx="14" fill="#171310" stroke="#C8A87C" stroke-width="4"/>
    <g fill="none" stroke="#C8A87C" stroke-width="2.5">
      <rect x="340" y="733" width="190" height="56" rx="5"/>
      <rect x="340" y="805" width="190" height="56" rx="5"/>
      <rect x="340" y="877" width="190" height="56" rx="5"/>
      <rect x="550" y="733" width="190" height="56" rx="5"/>
      <rect x="550" y="805" width="190" height="56" rx="5"/>
      <rect x="550" y="877" width="190" height="56" rx="5"/>
    </g>
    <g stroke="#C8A87C" stroke-width="2">
      <line x1="480" y1="761" x2="515" y2="761"/>
      <line x1="480" y1="833" x2="515" y2="833"/>
      <line x1="480" y1="905" x2="515" y2="905"/>
    </g>
    <circle cx="320" cy="761" r="8" fill="#E8A44C"/>
    <circle cx="320" cy="833" r="8" fill="#E8A44C" fill-opacity="0.55"/>
    <circle cx="320" cy="905" r="8" fill="#E8A44C" fill-opacity="0.25"/>
    <text x="540" y="1006" fill="#C8A87C" font-size="32" text-anchor="middle" font-weight="700">存储池 · 数据的家</text>
  </g>

  <!-- 四角对称虚线（统一 45° 指向 NAS 四角） -->
  <g stroke="#E8A44C" stroke-width="3" fill="none" stroke-dasharray="10 8" stroke-linecap="round">
    <path d="M256,648 L306,698"/>
    <path d="M800,660 L764,696"/>
    <path d="M330,1058 L314,962"/>
    <path d="M828,1062 L774,966"/>
  </g>

  <!-- 左上：手机（图标带 560~680，中心 y=620） -->
  <g fill="none" stroke="#C8A87C" stroke-width="3.5">
    <rect x="170" y="560" width="86" height="120" rx="14"/>
    <line x1="197" y1="662" x2="229" y2="662"/>
  </g>
  <text x="213" y="724" fill="#F5EDE0" font-size="28" text-anchor="middle">手机</text>

  <!-- 右上：笔记本 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3.5">
    <rect x="820" y="560" width="120" height="80" rx="6"/>
    <path d="M800,640 L960,640 L980,686 L780,686 Z"/>
  </g>
  <text x="880" y="724" fill="#F5EDE0" font-size="28" text-anchor="middle">电脑</text>

  <!-- 左下：电视（图标带 1060~1180，中心 y=1120） -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3.5">
    <rect x="170" y="1060" width="170" height="96" rx="8"/>
    <line x1="255" y1="1156" x2="255" y2="1176"/>
    <line x1="220" y1="1180" x2="290" y2="1180"/>
  </g>
  <text x="255" y="1236" fill="#F5EDE0" font-size="28" text-anchor="middle">电视</text>

  <!-- 右下：云 -->
  <g fill="#171310" stroke="#C8A87C" stroke-width="3.5">
    <path d="M830,1112 a28,28 0 0 1 6,-55 a36,36 0 0 1 68,-8 a25,25 0 0 1 11,48 a19,19 0 0 1 -13,15 Z"/>
  </g>
  <path d="M872,1116 L872,1148 M872,1148 L860,1136 M872,1148 L884,1136" stroke="#E8A44C" stroke-width="3.5" fill="none"/>
  <text x="880" y="1236" fill="#F5EDE0" font-size="28" text-anchor="middle">云端</text>

  <!-- 底部金句 + 规格行 -->
  <line x1="90" y1="1280" x2="990" y2="1280" stroke="#C8A87C" stroke-width="2"/>
  <text x="90" y="1360" fill="#F5EDE0" font-size="44" font-weight="700">设备会吃灰，<tspan fill="#E8A44C">折腾不会</tspan></text>
  <text x="990" y="1360" fill="#C8A87C" fill-opacity="0.6" font-size="26" text-anchor="end" font-family="'SF Mono','Menlo',monospace">FIG. 03 · REV 2.1</text>
</svg>
