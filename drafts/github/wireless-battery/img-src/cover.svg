      <text x="66" y="30" font-size="22" fill="#5E7A99">手柄</text>
    </g>
    <!-- clock -->
    <text x="1220" y="708" text-anchor="end" font-size="26" fill="#33547A">14:32</text>
    <text x="1220" y="744" text-anchor="end" font-size="20" fill="#9DBBDA">2026/11/19</text>
  </g>
  <text x="675" y="850" text-anchor="middle" font-size="26" fill="#9DBBDA">▲ 装完后，你的任务栏（示意）</text>

  <!-- feature row -->
  <g font-size="30" fill="#33547A" font-weight="500">
    <rect x="80" y="920" width="370" height="90" rx="22" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/>
    <circle cx="130" cy="965" r="8" fill="#0E8FC7"/><text x="156" y="976">低电量自动变红</text>
    <rect x="490" y="920" width="370" height="90" rx="22" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/>
    <circle cx="540" cy="965" r="8" fill="#0FA97E"/><text x="566" y="976">充电中显示 ⚡</text>
    <rect x="900" y="920" width="370" height="90" rx="22" fill="#FFFFFF" stroke="#D5E4F0" stroke-width="1.5"/>
    <circle cx="950" cy="965" r="8" fill="#3E7BD6"/><text x="976" y="976">多显示器都显示</text>
  </g>

  <!-- badges -->
  <g>
    <rect x="80" y="1090" width="420" height="120" rx="26" fill="#FFFFFF" stroke="#C9DCEF" stroke-width="2"/>
    <text x="290" y="1150" text-anchor="middle" font-size="52" font-weight="700" fill="#0E8FC7">3.4k+</text>
    <text x="290" y="1192" text-anchor="middle" font-size="24" fill="#5E7A99">GitHub Stars</text>
    <rect x="465" y="1090" width="420" height="120" rx="26" fill="#FFFFFF" stroke="#C9DCEF" stroke-width="2"/>
    <text x="675" y="1150" text-anchor="middle" font-size="52" font-weight="700" fill="#14324F">350KB</text>
    <text x="675" y="1192" text-anchor="middle" font-size="24" fill="#5E7A99">安装包体积 · 免管理员</text>
    <rect x="850" y="1090" width="420" height="120" rx="26" fill="#FFFFFF" stroke="#C9DCEF" stroke-width="2"/>
    <text x="1060" y="1150" text-anchor="middle" font-size="52" font-weight="700" fill="#0FA97E">免费开源</text>
    <text x="1060" y="1192" text-anchor="middle" font-size="24" fill="#5E7A99">Windows 任务栏插件级体验</text>
  </g>

  <!-- quote -->
  <rect x="80" y="1300" width="1190" height="150" rx="26" fill="#EAF6FD"/>
  <text x="675" y="1368" text-anchor="middle" font-size="40" font-weight="600" fill="#14324F">厂商全家桶可以卸了，电量本来就只该占一条任务栏</text>
  <text x="675" y="1416" text-anchor="middle" font-size="26" fill="#5E7A99">350KB · 约 2MB 内存 · 无后台服务</text>

  <!-- footer -->
  <line x1="80" y1="1640" x2="1270" y2="1640" stroke="#D5E4F0" stroke-width="2"/>
  <text x="80" y="1700" font-size="26" fill="#9DBBDA">屿华AI · YuHua-AIPlay</text>
  <text x="1270" y="1700" text-anchor="end" font-size="26" fill="#9DBBDA">01 / 06</text>
</svg>
